    } });

  /* ---------- TRI-16 a TRI-18 Cartões compactos ---------- */
  function compact(id, key, title, sub, scale, ticks, tickDec, size = 'm') {
    M.define({ id, key: 'tri.vitais.' + key, title, sub, size,
      render(b, c, el) {
        const m = A.MBY[key], a = get(c, key), bs = base(c, key);
        statusChip(el, a); histBtn(el, c, key);
        let bar = '', extra = '', band = m.ok, note = '';
        if (m.ok) {
          bar = U.hbar({ m, v: a && a.v, min: scale[0], max: scale[1], base: bs && bs.med, ticks, tickDec });
          note = T('Faixa esperada: {a} a {b} {u}.', { a: fmt(m.ok[0], m.dec), b: fmt(m.ok[1], m.dec), u: m.unit });
        } else if (bs && a) {
          const pct = (a.v - bs.med) / bs.med * 100;
          band = [bs.med * (1 - m.pct[0] / 100), bs.med * (1 + m.pct[0] / 100)];
          extra = `<span class="delta ${a.pctLevel ? 'l' + a.pctLevel : ''}">${T('{p}% sobre o seu padrão', { p: `${pct > 0 ? '+' : '−'}${fmt(Math.abs(pct), 1)}` })}</span>`;
          note = T('Atenção a partir de {a}% de variação sobre o seu padrão; crítico a partir de {b}%.', { a: fmt(m.pct[0], 1), b: fmt(m.pct[1], 0) });
        }
        b.innerHTML = `${readout(a, m, bs, extra)}${bar}<div class="sp-wrap"><span>${T('Últimos 14 dias')}</span>${U.spark(last14(c, key), { band, base: bs && bs.med })}</div><p class="vnote">${esc(note)}</p>`;
      } });
  }
  compact('TRI-16', 'temp', 'Temperatura corporal', 'Termômetro de ouvido ou testa', [35, 39], [36, 37.5], 1);
  compact('TRI-17', 'mass', 'Massa corporal', 'Dispositivo de massa da estação', null, null, 0, 'l');
  compact('TRI-18', 'glu', 'Glicemia capilar', 'Em jejum, pela manhã', [50, 140], [70, 110], 0, 'l');
})();

/* =========================================================
   Tripulante: mapa do corpo clicável (TRI-19)
   Figura em contorno holográfico; cada sistema do corpo recebe a
   cor do pior status entre suas métricas no último registro.
   Clique em um sistema: abre a métrica no TRI-10 e destaca a caixa.
   ========================================================= */
(function () {
  const A = window.AT, U = window.UI, M = window.MOD, { esc, fmt } = U;
  const T = (s, v) => window.I18N.t(s, v);

  /* Metade direita do contorno (x >= 0, y para baixo). Espelhada para formar o corpo. */
  const HALF = [[0, 0], [11, 2], [18, 10], [20, 24], [18, 38], [13, 49], [9, 55], [9, 63], [20, 68], [33, 72], [41, 79], [45, 92],
    [47, 115], [50, 140], [54, 165], [57, 188], [60, 198], [62, 214], [58, 226], [52, 224], [50, 210], [48, 196], [45, 172], [41, 146],
    [37, 122], [33, 104], [31, 124], [28, 150], [28, 166], [33, 186], [35, 206], [34, 240], [31, 275], [28, 296], [30, 320], [27, 355],
    [21, 384], [26, 396], [27, 406], [10, 408], [10, 394], [11, 380], [12, 350], [13, 322], [11, 296], [10, 268], [7, 236], [3, 214], [0, 212]];

  function bodyPath() {
    const right = HALF.slice(0, -1), left = HALF.slice(1).reverse().map(([x, y]) => [-x, y]).slice(0, -1);
    const P = right.concat(left), n = P.length;
    let d = `M${P[0][0]} ${P[0][1]}`;
    for (let i = 0; i < n; i++) {   // Catmull-Rom fechado -> Bézier cúbica
      const p0 = P[(i - 1 + n) % n], p1 = P[i], p2 = P[(i + 1) % n], p3 = P[(i + 2) % n];
      const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6], c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
      d += `C${c1[0].toFixed(1)} ${c1[1].toFixed(1)} ${c2[0].toFixed(1)} ${c2[1].toFixed(1)} ${p2[0]} ${p2[1]}`;
    }
    return d + 'Z';
  }
  const BODY = bodyPath();

  /* Órgãos (traço fino). Cada um pertence a um sistema e herda a cor do status. */
  const ORGANS = {
    neuro: '<path d="M-12 20c0-9 6-14 12-14s12 5 12 14c0 7-5 11-12 11S-12 27-12 20z"/><path d="M0 7v23M-7 13c3 2 3 6 0 8M7 13c-3 2-3 6 0 8"/>',
    resp: '<path d="M-4 86c-8 2-17 14-19 32-1 12 1 21 6 22 6 1 11-4 13-12V86z"/><path d="M4 86c8 2 17 14 19 32 1 12-1 21-6 22-6 1-11-4-13-12V86z"/>',
    cardio: '<path d="M6 128c-7-5-11-9-11-14 0-4 3-6 6-6 2 0 4 1 5 3 1-2 3-3 5-3 3 0 6 2 6 6 0 5-4 9-11 14z"/>',
    imuno: '<ellipse cx="-14" cy="156" rx="6" ry="9" transform="rotate(20 -14 156)"/><circle cx="-12" cy="66" r="2.2"/><circle cx="12" cy="66" r="2.2"/><circle cx="-24" cy="98" r="2"/><circle cx="24" cy="98" r="2"/>',
    metab: '<path d="M-14 166c4-6 24-6 28 0 3 8-2 22-14 22s-17-14-14-22z"/><path d="M-8 174c5 3 11 3 16 0M-8 181c5 2 11 2 16 0"/>',
    osseo: '<path d="M0 60v150" stroke-dasharray="2 3"/><path d="M-18 92c10 4 26 4 36 0M-19 104c11 4 27 4 38 0M-19 116c11 4 27 4 38 0M-17 128c10 3 24 3 34 0"/><path d="M-20 215v70M20 215v70M-19 300v70M19 300v70"/><circle cx="-20" cy="292" r="3"/><circle cx="20" cy="292" r="3"/>',
  };

  /* Sistemas: posição do ponto, lado do rótulo, métricas, caixa de destino */
  const SYS = [
    { id: 'neuro', name: 'Neurocognitivo', p: [0, 20], side: -1, ly: 22, metrics: ['sleep', 'eff', 'mood', 'stress', 'rt', 'cort'], go: 'sleep', target: 'TRI-06',
      sum: g => `${T('Sono')} ${g('sleep', 1, 'h')}` },
    { id: 'resp', name: 'Respiratório', p: [-14, 112], side: -1, ly: 112, metrics: ['spo2'], go: 'spo2', target: 'TRI-15',
      sum: g => `SpO₂ ${g('spo2', 0, '%')}` },
    { id: 'metab', name: 'Metabólico', p: [0, 178], side: -1, ly: 200, metrics: ['mass', 'glu', 'shannon'], go: 'mass', target: 'TRI-17',
      sum: g => `${T('Massa')} ${g('mass', 1, 'kg')}` },
    { id: 'cardio', name: 'Cardiovascular', p: [6, 118], side: 1, ly: 92, metrics: ['hr', 'sbp', 'dbp', 'imt'], go: 'hr', target: 'TRI-13',
      sum: g => `${T('PA')} ${g('sbp', 0)}/${g('dbp', 0)}` },
    { id: 'imuno', name: 'Imunológico', p: [-14, 156], side: 1, ly: 160, metrics: ['temp', 'wbc', 'crp', 'ebv'], go: 'wbc', target: 'TRI-07',
      sum: g => `${T('Temp')} ${g('temp', 1, '°C')}` },
    { id: 'osseo', name: 'Ósseo-muscular', p: [20, 292], side: 1, ly: 292, metrics: ['ctx', 'vitd'], go: 'ctx', target: 'TRI-07',
      sum: g => `${T('Vit. D')} ${g('vitd', 0)} ng/mL` },
  ];
  const LVL_TXT = ['Normal', 'Atenção', 'Crítico'];

  function sysStatus(c, s) {
    const items = c.st.items.filter(i => s.metrics.includes(i.m.key));
    return items.length ? Math.max(...items.map(i => i.level)) : null;
  }

  M.define({ id: 'TRI-19', key: 'tri.corpo', title: 'Mapa do corpo', sub: 'Clique em um sistema para ver os detalhes', size: 'm', rows: 2,
    render(b, c) {
      const get = (k, d, u) => { const a = c.st.items.find(i => i.m.key === k); return a ? fmt(a.v, d) + (u ? ' ' + u : '') : '—'; };
      const st = Object.fromEntries(SYS.map(s => [s.id, sysStatus(c, s)]));
      /* Resumo: se algo estiver fora do esperado, mostra a métrica pior; senão, o resumo padrão do sistema */
      const summary = s => {
        const bad = c.st.items.filter(i => s.metrics.includes(i.m.key) && i.level > 0).sort((x, y) => y.level - x.level || (y.sz || 0) - (x.sz || 0))[0];
        return bad ? `${bad.m.short} ${fmt(bad.v, bad.m.dec)} ${bad.m.unit}` : s.sum(get);
      };
      const cls = l => l == null ? 'ln' : 'l' + l;
      const LX = 94;   // rótulos começam aqui e crescem para fora, sem cobrir o corpo
      const labels = SYS.map(s => {
        const l = st[s.id], x0 = s.p[0], y0 = s.p[1], ex = s.side * 72, tx = s.side * LX, anchor = s.side < 0 ? 'end' : 'start';
        return `<g class="bm-sys ${cls(l)}" data-sys="${s.id}" role="button" tabindex="0" aria-label="${esc(T(s.name))}: ${l == null ? T('sem dados') : T(LVL_TXT[l])}. ${esc(summary(s))}">
          <polyline class="bm-lead" points="${x0},${y0} ${ex},${s.ly} ${tx - s.side * 4},${s.ly}"/>
          <circle class="bm-ring" cx="${x0}" cy="${y0}" r="7"/><circle class="bm-dot" cx="${x0}" cy="${y0}" r="3.2"/>
          <text class="bm-name" x="${tx}" y="${s.ly - 6}" text-anchor="${anchor}">${esc(T(s.name))}</text>
          <text class="bm-st" x="${tx}" y="${s.ly + 6}" text-anchor="${anchor}">${l == null ? T('Sem dados') : T(LVL_TXT[l])}</text>
          <text class="bm-sum" x="${tx}" y="${s.ly + 17}" text-anchor="${anchor}">${esc(summary(s))}</text>
          <rect class="bm-hit" x="${s.side < 0 ? -186 : ex}" y="${s.ly - 18}" width="${186 - 72}" height="40"/>
        </g>`;
      }).join('');
      const organs = SYS.map(s => `<g class="bm-org ${cls(st[s.id])}" data-org="${s.id}">${ORGANS[s.id]}</g>`).join('');
      b.innerHTML = `<div class="bodymap"><svg viewBox="-186 -14 372 450" role="group" aria-label="${T('Mapa do corpo com status por sistema')}">
        <defs>
          <clipPath id="bm-clip"><path d="${BODY}"/></clipPath>
          <linearGradient id="bm-fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".16"/><stop offset="1" stop-color="var(--accent)" stop-opacity=".04"/></linearGradient>
          <linearGradient id="bm-scan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity="0"/><stop offset=".85" stop-color="var(--accent)" stop-opacity=".22"/><stop offset="1" stop-color="var(--accent)" stop-opacity=".55"/></linearGradient>
          <radialGradient id="bm-pad"><stop offset="0" stop-color="var(--accent)" stop-opacity=".35"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></radialGradient>
        </defs>
        <ellipse class="bm-pad-glow" cx="0" cy="410" rx="78" ry="14" fill="url(#bm-pad)"/>
        <ellipse class="bm-pad" cx="0" cy="410" rx="58" ry="9"/><ellipse class="bm-pad" cx="0" cy="410" rx="40" ry="6" opacity=".6"/>
        <path class="bm-body" d="${BODY}" fill="url(#bm-fill)"/>
        <g clip-path="url(#bm-clip)"><rect class="bm-scanbar" x="-70" y="-40" width="140" height="40" fill="url(#bm-scan)"/></g>
        <g class="bm-organs">${organs}</g>
        ${labels}
      </svg>
      <div class="bm-key"><span><i class="l0"></i>${T('Normal')}</span><span><i class="l1"></i>${T('Atenção')}</span><span><i class="l2"></i>${T('Crítico')}</span></div></div>`;

      b.querySelectorAll('.bm-sys').forEach(g => {
        const s = SYS.find(x => x.id === g.dataset.sys), org = b.querySelector(`[data-org="${s.id}"]`);
        const go = () => {
          c.S.metric = s.go; c.rerender();
          const t = document.querySelector(`[data-mod="${s.target}"]`);
          if (t) { t.scrollIntoView({ behavior: 'smooth', block: 'center' }); t.classList.remove('flash'); void t.offsetWidth; t.classList.add('flash'); }
        };
        g.addEventListener('click', go);
        g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } });
        g.addEventListener('mouseenter', () => org.classList.add('hi')); g.addEventListener('mouseleave', () => org.classList.remove('hi'));
        g.addEventListener('focus', () => org.classList.add('hi')); g.addEventListener('blur', () => org.classList.remove('hi'));
      });
    } });

  window.BODYMAP = { SYS, BODY };
})();

/* =========================================================
   Tripulante: sono (TRI-20)
   Fases do sono SINTÉTICAS (data/sleep_stages.csv, gerado por
   scripts/gen_sleep_stages.py). Só exibição: não entram no diagnóstico.
   ========================================================= */
(function () {
  const A = window.AT, U = window.UI, M = window.MOD, { esc, fmt, icon, chip } = U;
  const T = (s, v) => window.I18N.t(s, v);

  /* Referência para adultos saudáveis (% do tempo total de sono). A CONFERIR na fonte. */
  const STG = [
    { k: 'light', name: 'Sono leve', ref: [50, 60], what: 'Fases N1 e N2: transição e sono estável.' },
    { k: 'deep', name: 'Sono profundo', ref: [13, 23], what: 'Fase N3: recuperação física e imune.' },
    { k: 'rem', name: 'Sono REM', ref: [20, 25], what: 'Sonhos, memória e regulação emocional.' },
  ];
  const hm = min => `${Math.floor(min / 60)} h ${String(Math.round(min % 60)).padStart(2, '0')} min`;

  function donut(n) {
    const R = 52, C = 2 * Math.PI * R, gap = 1.6;
    let off = 0;
    const arcs = STG.map(s => {
      const len = C * n[s.k] / 100, a = `<circle class="sd-arc sd-${s.k}" r="${R}" cx="70" cy="70" stroke-dasharray="${Math.max(0, len - gap).toFixed(2)} ${C.toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}"><title>${T(s.name)}: ${fmt(n[s.k], 1)}%</title></circle>`;
      off += len; return a;
    }).join('');
    return `<svg class="sdonut" viewBox="0 0 140 140" role="img" aria-label="${T('Fases do sono')}: ${T('Sono leve')} ${fmt(n.light, 0)}%, ${T('Sono profundo')} ${fmt(n.deep, 0)}%, REM ${fmt(n.rem, 0)}%"><circle class="sd-track" r="${R}" cx="70" cy="70"/><g transform="rotate(-90 70 70)">${arcs}</g><text x="70" y="70" class="sd-big">${Math.floor(n.tst / 60)}h${String(Math.round(n.tst % 60)).padStart(2, '0')}</text><text x="70" y="88" class="sd-sm">${T('dormindo')}</text></svg>`;
  }

  function bars(nights) {
    const W = 300, H = 92, pad = 2, maxMin = Math.max(540, ...nights.map(n => n.tst)), bw = (W - pad * 2) / nights.length;
    const cols = nights.map((n, i) => {
      let y = H; const x = pad + i * bw + bw * 0.18, w = bw * 0.64;
      const seg = ['deep', 'rem', 'light'].map(k => { const h = H * (n.tst * n[k] / 100) / maxMin; y -= h; return `<rect class="sd-${k}" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(0, h - 0.6).toFixed(1)}"/>`; }).join('');
      return `<g><title>${U.fmtD(n.date)}: ${hm(n.tst)} · ${T('Sono leve')} ${fmt(n.light, 0)}%, ${T('Sono profundo')} ${fmt(n.deep, 0)}%, REM ${fmt(n.rem, 0)}%</title>${seg}</g>`;
    }).join('');
    const y7 = H - H * 420 / maxMin;
    return `<svg class="sbars" viewBox="0 0 ${W} ${H + 14}" preserveAspectRatio="none" aria-hidden="true"><line class="sb-ref" x1="0" x2="${W}" y1="${y7.toFixed(1)}" y2="${y7.toFixed(1)}"/>${cols}</svg>
      <div class="sb-ax"><span>${U.fmtD(nights[0].date)}</span><span>${T('linha tracejada: 7 h')}</span><span>${U.fmtD(nights[nights.length - 1].date)}</span></div>`;
  }

  M.define({ id: 'TRI-20', key: 'tri.sono', title: 'Sono', sub: 'Fases da última noite, eficiência e últimas 14 noites', size: 'xl',
    render(b, c, el) {
      const nights = A.sleepNights(c.crew.id), n = nights[nights.length - 1];
      const effA = c.st.items.find(i => i.m.key === 'eff'), slA = c.st.items.find(i => i.m.key === 'sleep');
      el.querySelector('.mod-x').innerHTML = `<span class="chip n" title="${T('Fases do sono geradas para demonstração; não são medidas reais')}">${T('Fases sintéticas')}</span>${slA ? chip(Math.max(slA.level, effA ? effA.level : 0)) : ''}`;
      if (!n) { b.innerHTML = `<div class="empty"><b>${T('Sem fases do sono')}</b>${T('Rode scripts/gen_sleep_stages.py e web/prep_data.py.')}</div>`; return; }
      const m = A.MBY.eff, bs = A.baseline(m, c.crew.id);
      const legend = STG.map(s => {
        const v = n[s.k], out = v < s.ref[0] ? T('abaixo') : v > s.ref[1] ? T('acima') : null;
        return `<li><i class="sd-sw sd-${s.k}"></i><div><b>${T(s.name)}</b><span>${T(s.what)}</span></div><strong class="num">${fmt(v, 0)}%<small>${hm(n.tst * v / 100)}</small></strong><em class="${out ? 'out' : ''}">${T('ref. {a} a {b}%', { a: s.ref[0], b: s.ref[1] })}${out ? ` · ${out}` : ''}</em></li>`;
      }).join('');
      b.innerHTML = `<div class="sleep">
        <div class="sl-donut">${donut(n)}<time>${T('Noite de {d}', { d: U.fmtDT(n.date) })}</time></div>
        <ul class="sl-leg">${legend}</ul>
        <div class="sl-eff"><h3>${T('Eficiência do sono')}</h3><div class="gauge-wrap sm">${U.gauge({ m, v: effA && effA.v, min: 60, max: 100, base: bs && bs.med, ticks: [m.warn[0], m.ok[0]] })}</div>
          <div class="vr"><strong class="num">${effA ? fmt(effA.v, 0) : '—'}<small>%</small></strong><span>${T('do tempo na cama dormindo')}</span></div></div>
        <div class="sl-hist"><h3>${T('Últimas 14 noites')} <span>${T('(altura = horas dormidas; cores = fases)')}</span></h3>${bars(nights.slice(-14))}</div>
      </div>
      <p class="vnote">${T('Fases do sono sintéticas, geradas a partir da duração, da eficiência, do estresse e da idade de cada tripulante, para demonstrar a visualização. As faixas de referência (adultos saudáveis) ainda precisam ser conferidas na fonte. Em missão, as fases viriam de uma faixa de EEG ou de um vestível validado.')}</p>`;
    } });
})();

/* =========================================================
   Tripulante: barra de cenários de um clique (TRI-21)
   Lógica dos cenários em scenarios.js; aqui só a interface.
   ========================================================= */
(function () {
  const U = window.UI, M = window.MOD, { esc, icon } = U;
  const T = (s, v) => window.I18N.t(s, v);

  M.define({ id: 'TRI-21', key: 'tri.cenarios', title: 'Cenários de demonstração', sub: 'Um clique simula uma situação no tripulante selecionado. Tudo em memória: a base não muda.', size: 'full',
    render(b, c, el) {
      const SC = window.SCN, st = SC.state, ids = Object.keys(SC.SCENARIOS);
      const on = st.active && st.crew === c.crew.id ? st.active : null;
      const other = st.active && st.crew !== c.crew.id;
      el.querySelector('.mod-x').innerHTML = `<span class="chip n">${T('Simulado')}</span>`;
      const cur = on && SC.SCENARIOS[on];
      b.innerHTML = `<div class="scn-grid" role="group" aria-label="${T('Cenários')}">${ids.map(id => { const s = SC.SCENARIOS[id]; return `<button class="scn-btn scn-${id}" data-scn="${id}" aria-pressed="${on === id}"><span class="scn-ic">${icon(s.icon)}</span><span><b>${esc(T(s.name))}</b><small>${esc(T(s.desc))}</small></span></button>`; }).join('')}</div>
        ${cur ? `<div class="scn-exp"><b>${T('O que observar agora')}</b><ul>${cur.expect.map(e => `<li>${esc(T(e))}</li>`).join('')}</ul><button class="btn sm" type="button" data-scn-off>${icon('undo')}${T('Voltar aos dados da base')}</button></div>` : ''}
        ${other ? `<p class="scn-note">${T('Há um cenário ativo em {n}. Escolher outro aqui substitui aquele.', { n: esc(SC.crewName(st.crew)) })}</p>` : ''}`;
      b.querySelectorAll('[data-scn]').forEach(btn => btn.onclick = () => {
        const id = btn.dataset.scn;
        if (on === id) { SC.reset(); window.APP.toast(T('Dados da base restaurados')); }
        else { SC.apply(id, c.crew.id); window.APP.toast(T('Cenário "{s}" aplicado a {n}', { s: T(SC.SCENARIOS[id].name), n: c.crew.name })); }
        window.APP.refreshHeader(); c.rerender(); window.SCN.renderBanner();
      });
      const off = b.querySelector('[data-scn-off]');
      if (off) off.onclick = () => { SC.reset(); window.APP.refreshHeader(); c.rerender(); window.SCN.renderBanner(); window.APP.toast(T('Dados da base restaurados')); };
    } });
})();

/* =========================================================
   Tripulante: explicação e perguntas (TRI-22)
   1) Texto determinístico na hora (regras), e logo abaixo o botão
      "Explicar com SI" (servidor local -> modelo -> guarda em web/ai.py).
   2) Caixa "Pergunte à SI": perguntas sugeridas têm RESPOSTA PRONTA
      (sem chamar a API). Se o usuário alterar o texto, a pergunta vai
      para /api/perguntar, com a mesma guarda.
   Na interface, a camada de inteligência é sempre chamada de SI.
   ========================================================= */
(function () {
  const A = window.AT, U = window.UI, M = window.MOD, { esc, fmt, icon } = U;
  const T = (s, v) => window.I18N.t(s, v), R = r => window.I18N.reason(r);
  const LV = ['Normal', 'Atenção', 'Crítico'];
  const results = new Map();   // pacote (texto) -> resposta da SI (explicação)
  const QA = new Map();        // tripulante|idioma -> [{q, a, fonte, ...}]
  const E = { status: null, draft: '' };

  /* ---------- Perguntas sugeridas com resposta pronta (sem API) ---------- */
  const SUGGEST = [
    { q: 'O que significam Normal, Atenção e Crítico?',
      a: p => T('Normal: o valor está na faixa de referência e perto do seu padrão pessoal. Atenção: saiu da faixa de referência ou se afastou do seu padrão; vale repetir a medida e observar. Crítico: está fora da faixa ampliada; acione o médico de voo. Hoje sua condição geral é {c}.', { c: p.condicao_geral.toLowerCase() }) },
    { q: 'O que é o meu padrão pessoal?',
      a: () => T('É a sua faixa típica, calculada com a mediana e a dispersão das suas medidas nos primeiros {n} dias da missão. Assim o sistema compara você com você mesmo, e não só com a média da população.', { n: A.BASE_DAYS }) },
    { q: 'Devo me preocupar com estes alertas?',
      a: () => T('Um alerta indica que algo mudou, não é um diagnóstico. Repita a medida nas mesmas condições e siga as ações sugeridas. Se o alerta persistir por 2 dias ou vier com sintomas, fale com o médico de voo.') },
    { q: 'Como o sono afeta os meus indicadores?',
      a: () => T('Dormir pouco aumenta o estresse, piora o tempo de reação e o humor e pode elevar a frequência cardíaca e a pressão. Por isso o sistema cruza o sono com esses indicadores no padrão "Fadiga e estresse combinados".') },
    { q: 'Por que a radiação importa nesta missão?',
      a: () => T('Fora do campo magnético da Terra, raios cósmicos e eventos solares aumentam o risco de câncer e de efeitos no coração e no sistema nervoso a longo prazo. A NASA limita a dose de carreira a 600 mSv; a tela Radiação mostra quanto do limite já foi usado.') },
    { q: 'Estes dados são reais?',
      a: () => T('Não. Os dados dos tripulantes são sintéticos, criados para demonstração. Os limites de radiação e os dados de atividade solar da tela Radiação vêm de fontes reais da NASA e da NOAA.') },
  ];
  const norm = s => (s || '').toLowerCase().replace(/\s+/g, ' ').replace(/[?.!¿¡\s]+$/g, '').replace(/^[¿¡\s]+/, '').trim();
  const canned = (text, p) => { const s = SUGGEST.find(x => norm(T(x.q)) === norm(text)); return s ? s.a(p) : null; };

  /* ---------- Pacote de fatos (a única coisa que a SI recebe) ---------- */
  function packet(crew, st) {
    const flagged = st.flagged.slice(0, 6);
    const S = window.SCN && window.SCN.state;
    const act = a => { const ks = Object.keys(a.m.act); return a.m.act[a.side > 0 ? 'high' : 'low'] || a.m.act[ks[0]]; };
    const pats = A.patterns(A.szMapFromAssess(st.items));
    const cand = [];
    pats.forEach(p => cand.push(p.act));
    flagged.forEach(a => cand.push(act(a)));
    const last = A.crewLastDate(crew.id);
    return {
      idioma: window.I18N.LANGS[window.I18N.lang].name,
      tripulante: crew.name,
      data: last ? U.fmtDT(last) : '',
      condicao_geral: T(LV[st.level]),
      dados: T('sintéticos de demonstração'),
      cenario: S && S.active && S.crew === crew.id ? T(window.SCN.SCENARIOS[S.active].name) + ' (' + T('simulado') + ')' : null,
      sinalizados: flagged.map(a => ({
        indicador: a.m.label,
        valor: `${fmt(a.v, a.m.dec)} ${a.m.unit}`,
        estado: T(LV[a.level]),
        padrao_pessoal: a.base && !a.m.noZ ? `${fmt(a.base.med, a.m.dec)} ${a.m.unit}` : null,
        desvio: a.z != null ? T('{z} desvios do seu padrão', { z: `${a.z > 0 ? '+' : '−'}${fmt(Math.abs(a.z), 1)}` }) : null,
        faixa_referencia: a.m.ok ? T('{a} a {b} {u}', { a: fmt(a.m.ok[0], a.m.dec), b: fmt(a.m.ok[1], a.m.dec), u: a.m.unit }) : null,
        motivos: a.reasons.map(R),
      })),
      padroes: pats.map(p => ({ titulo: p.title, texto: p.text })),
      indicadores_normais: st.items.length - st.flagged.length,
      acoes_candidatas: [...new Set(cand)].slice(0, 6),
    };
  }

  /* ---------- Texto determinístico: sempre disponível, sem rede ---------- */
  function template(p) {
    if (!p.sinalizados.length) return { resumo: T('Todos os {n} indicadores do último registro ({d}) estão dentro do esperado para você, tanto na faixa de referência quanto no seu padrão pessoal.', { n: p.indicadores_normais, d: p.data }), acoes: [] };
    const n = p.sinalizados.length;
    const parts = [T(n === 1 ? 'Condição geral: {c}, com 1 indicador fora do esperado no registro de {d}.' : 'Condição geral: {c}, com {n} indicadores fora do esperado no registro de {d}.', { c: p.condicao_geral.toLowerCase(), n, d: p.data })];
    p.sinalizados.slice(0, 3).forEach(s => parts.push(T('{i} em {v} ({e}): {m}', { i: s.indicador, v: s.valor, e: s.estado.toLowerCase(), m: s.motivos.join(', ') }) + (s.padrao_pessoal ? T('; seu padrão é {p}', { p: s.padrao_pessoal }) : '') + '.'));
    if (n > 3) parts.push(T('Há mais {n} na lista de alertas.', { n: n - 3 }));
    p.padroes.slice(0, 2).forEach(x => parts.push(T('Padrão combinado "{t}": {x}', { t: x.titulo, x: x.texto })));
    return { resumo: parts.join(' '), acoes: p.acoes_candidatas.slice(0, 3) };
  }

  async function loadStatus() {
    try { const r = await fetch('/api/status', { cache: 'no-store' }); E.status = r.ok ? await r.json() : { off: true }; }
    catch (e) { E.status = { off: true }; }
  }
  async function post(url, body) {
    try { const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }); return await r.json(); }
    catch (e) { return { ok: false, fonte: 'off', motivo: T('o servidor local não respondeu') }; }
  }
  const offRes = () => ({ ok: false, fonte: 'off', motivo: T('o servidor local não está rodando (abra pelo endereço http://localhost:8765)') });

  function metaBadge(res) {
    const n = res.numeros_conferidos || 0;
    return `<span class="chip l0">${icon('check')}${T('SI verificada')}</span><span class="ai-meta">${T(n === 1 ? '1 número conferido com os dados' : '{n} números conferidos com os dados', { n })} · ${esc(res.modelo || '')}${res.fonte === 'cache' ? ' · ' + T('do cache, sem custo') : res.usd != null ? ` · US$ ${res.usd.toFixed(5)}` : ''}</span>`;
  }
  function failNote(res) {
    return res.fonte === 'ia'
      ? `${icon('warn')}${T('A resposta da SI foi descartada pela guarda: {m}.', { m: esc(String(res.motivo).replace(/\.+$/, '')) })}`
      : `${icon('info')}${T('SI indisponível: {m}.', { m: esc(String(res.motivo).replace(/\.+$/, '')) })}`;
  }

  M.define({ id: 'TRI-22', key: 'tri.explicacao', title: 'Explicação em linguagem simples', sub: 'A SI pode cometer erros. Avalie com cuidado qualquer alerta de parâmetro fora do normal e, se possível, confirme com um especialista.', size: 'full',
    render(b, c, el) {
      el.classList.add('si-mod');
      const p = packet(c.crew, c.st), pk = JSON.stringify(p), res = results.get(pk);
      const st = E.status, qaKey = c.crew.id + '|' + window.I18N.lang, hist = QA.get(qaKey) || [];
      const tip = st && st.off ? T('Servidor local não está rodando') : st && !st.chave ? T('Sem chave da SI no servidor local') : st && st.aviso_chave ? T('Chave da SI com formato suspeito: confira o .env') : T('Gera a explicação com a SI e confere cada número');
      const tpl = template(p);

      let siBlock = '';
      if (res && res.loading) siBlock = `<div class="ai-si loading"><span class="ai-spin"></span>${T('Gerando...')}</div>`;
      else if (res && res.ok) siBlock = `<div class="ai-si"><div class="ai-badges">${metaBadge(res)}</div><p class="ai-text">${esc(res.resumo)}</p>${res.acoes && res.acoes.length ? `<div class="ai-acts"><b>${T('O que fazer')}</b><ul>${res.acoes.map(a => `<li>${esc(a)}</li>`).join('')}</ul></div>` : ''}</div>`;
      else if (res) siBlock = `<p class="ai-note ${res.fonte === 'ia' ? 'warn' : ''}">${failNote(res)} ${T('O texto por regras acima continua valendo.')}</p>`;

      const qaItem = h => {
        let badge, body;
        if (h.loading) { badge = ''; body = `<p class="qa-a muted"><span class="ai-spin"></span>${T('Gerando...')}</p>`; }
        else if (h.fonte === 'pronta') { badge = `<span class="chip n">${icon('check')}${T('Resposta pronta, sem uso da SI')}</span>`; body = `<p class="qa-a">${esc(h.a)}</p>`; }
        else if (h.ok) { badge = metaBadge(h); body = `<p class="qa-a">${esc(h.a)}</p>`; }
        else { badge = ''; body = `<p class="ai-note ${h.fonte === 'ia' ? 'warn' : ''}">${failNote(h)}</p><p class="qa-a muted">${T('Não consegui responder com segurança. Para essa dúvida, fale com o médico de voo ou um especialista.')}</p>`; }
        return `<li><p class="qa-q">${icon('user')}${esc(h.q)}</p><div class="ai-badges">${badge}</div>${body}</li>`;
      };

      b.innerHTML = `<div class="ai-box">
        <div class="ai-badges"><span class="chip n">${T('Texto automático por regras')}</span></div>
        <p class="ai-text">${esc(tpl.resumo)}</p>
        ${tpl.acoes.length ? `<div class="ai-acts"><b>${T('O que fazer')}</b><ul>${tpl.acoes.map(a => `<li>${esc(a)}</li>`).join('')}</ul></div>` : ''}
        <div class="ai-cta"><button class="btn sm ai-btn${st && (st.off || !st.chave) ? ' muted-btn' : ''}" type="button" data-explain ${res && res.loading ? 'disabled' : ''} title="${esc(tip)}">${icon('spark')}${T('Explicar com SI')}</button><span class="ai-meta">${esc(tip)}</span></div>
        ${siBlock}

        <div class="qa">
          <h3>${icon('spark')}${T('Pergunte à SI')}</h3>
          <form class="qa-form" autocomplete="off"><input class="inp" name="q" maxlength="300" placeholder="${esc(T('Escreva sua dúvida sobre estes resultados'))}" value="${esc(E.draft)}"><button class="btn primary sm" type="submit">${T('Perguntar')}</button></form>
          <div class="qa-sug"><span>${T('Sugestões (resposta pronta, sem custo):')}</span>${SUGGEST.map((s, i) => `<button type="button" class="pill" data-sug="${i}">${esc(T(s.q))}</button>`).join('')}</div>
          <p class="qa-hint">${T('Se você alterar o texto de uma sugestão, a pergunta vai para a SI e passa pela mesma guarda.')}</p>
          ${hist.length ? `<ul class="qa-list">${hist.map(qaItem).join('')}</ul>` : ''}
        </div>

        <details class="ai-pkt"><summary>${T('Ver exatamente o que é enviado à SI')}</summary><pre>${esc(JSON.stringify(p, null, 2))}</pre></details>
        <p class="vnote">${T('Apoio à decisão, não diagnóstico. Dados sintéticos. A guarda descarta qualquer resposta da SI que cite um número que não está nos dados, use nome de doença ou remédio, ou sugira ação fora da lista do motor.')}</p>
      </div>`;

      /* Explicar com SI */
      b.querySelector('[data-explain]').onclick = async () => {
        if (st && st.off) { results.set(pk, offRes()); c.rerender(); return; }
        results.set(pk, { loading: true }); c.rerender();
        results.set(pk, await post('/api/explicar', p));
        if (document.querySelector('[data-mod="TRI-22"]')) c.rerender();
      };

      /* Perguntas */
      const input = b.querySelector('.qa-form input');
      input.oninput = () => { E.draft = input.value; };
      const ask = async text => {
        const q = text.trim(); if (!q) return;
        const list = QA.get(qaKey) || []; QA.set(qaKey, list);
        const ready = canned(q, p);
        if (ready) { list.unshift({ q, a: ready, fonte: 'pronta' }); }
        else if (st && st.off) { list.unshift({ q, ...offRes() }); }
        else {
          const item = { q, loading: true }; list.unshift(item); c.rerender();
          const r = await post('/api/perguntar', { pergunta: q, pacote: p });
          Object.assign(item, { loading: false, ...r, a: r.resposta });
        }
        list.splice(4);
        E.draft = ready ? q : '';  // sugestão continua no campo para o usuário poder editar e reenviar
        if (document.querySelector('[data-mod="TRI-22"]')) { c.rerender(); const f = document.querySelector('[data-mod="TRI-22"] .qa'); if (f) f.scrollIntoView({ block: 'nearest' }); }
      };
      b.querySelector('.qa-form').onsubmit = e => { e.preventDefault(); ask(input.value); };
      b.querySelectorAll('[data-sug]').forEach(btn => btn.onclick = () => { const s = T(SUGGEST[+btn.dataset.sug].q); input.value = s; ask(s); });
    } });

  loadStatus();
  window.EXPLAIN = { packet, template, results, QA, SUGGEST, canned, state: E, loadStatus };
})();

/* =========================================================
   Radiação: tela RAD (dose de carreira, saída da base,
   atividade solar real, efeitos no corpo, fontes)
   Modelo e constantes em radiation.js.
   ========================================================= */
(function () {
  const A = window.AT, U = window.UI, M = window.MOD, R = window.RAD, { esc, fmt, icon, chip } = U;
  const V = (window.VIEWS = window.VIEWS || {});
  const RC = R.RC;

  const LAYOUT = [
    'RAD-01',                 // seleção de tripulante
    'RAD-02', 'RAD-03',       // orçamento de dose da carreira | dose projetada (velocímetro)
    'RAD-10',                 // trajetória da dose: recebida até hoje e projeção contra o limite
    'RAD-04',                 // planejar saída da base
    'RAD-05',                 // atividade solar e eventos (dados reais)
    'RAD-06', 'RAD-07',       // efeitos no corpo | grandezas e partículas
    'RAD-08',                 // escala de doses
    'RAD-09',                 // fontes e suposições
  ];

  /* ---------- Estado do plano (conveniência local: lembra entre recargas) ---------- */
  const LS = 'athenance.rad.plan';
  const RP = { prior: { ...R.PRIOR_DEFAULT }, surfaceDays: 30, returnDays: 180, hours: 6, sorties: 1, prot: 'traje', solar: null, returnMin: 45 };
  try { Object.assign(RP, JSON.parse(localStorage.getItem(LS) || '{}')); } catch (e) {}
  const save = () => { try { localStorage.setItem(LS, JSON.stringify(RP)); } catch (e) {} };

  const SW = () => (window.SEED && window.SEED.sw) || null;
  const nowMonth = () => { const s = SW(); return s ? s.fetched.slice(0, 7) : new Date().toISOString().slice(0, 7); };

  function ssnFor(month) {
    const s = SW(); if (!s) return null;
    const o = s.ssn.find(m => m[0] === month); if (o && o[1] >= 0) return o[1];
    const p = s.pred.find(m => m[0] === month); return p ? p[1] : null;
  }
  function autoSolar(crew) {
    const S = window.SCN && window.SCN.state;
    if (S && S.active === 'radiacao' && S.crew === crew) return { v: 'evento', why: window.I18N.t('cenário "Evento de radiação" ativo') };
    const model = R.sepModel(SW()), ssn = ssnFor(nowMonth());
    if (!model || ssn == null) return { v: 'calmo', why: window.I18N.t('sem dados de clima espacial') };
    const p = model.pMonth(ssn);
    return { v: p >= 0.5 ? 'elevado' : 'calmo', why: window.I18N.t('{p}% de chance de evento SEP neste mês (manchas: {s})', { p: Math.round(p * 100), s: fmt(ssn, 0) }) };
  }

  function health(crew) {
    const st = A.crewStatus(crew), red = [];
    const lvl = Math.max(0, ...st.items.filter(i => i.m.cat !== 'rad' && i.m.cat !== 'env').map(i => i.level));  // saúde, sem a própria radiação
    const crit = keys => st.items.some(i => keys.includes(i.m.key) && i.level === 2);
    if (crit(['hr', 'sbp', 'dbp'])) red.push('cardiovascular');
    if (crit(['sleep', 'eff', 'mood', 'stress', 'rt'])) red.push('neurocognitivo');
    return { level: lvl, red };
  }

  function context(S, rerender) {
    const crews = A.DB.crew;
    if (!crews.find(c => c.id === S.crewId)) S.crewId = crews[0].id;
    const crew = crews.find(c => c.id === S.crewId);
    const last = A.crewLastDate(crew.id);
    const auto = autoSolar(crew.id);
    const plan = {
      prior: RP.prior[crew.id] != null ? RP.prior[crew.id] : 0,
      elapsedDays: last ? A.missionDay(last) : 0,
      surfaceDays: RP.surfaceDays, returnDays: RP.returnDays, hours: RP.hours, sorties: RP.sorties, prot: RP.prot,
      solar: RP.solar || auto.v, returnMin: RP.returnMin,
    };
    const proj = R.project(plan), hl = health(crew.id), dec = R.decide(plan, proj, hl);
    return { S, crews, crew, last, plan, proj, hl, dec, auto, rerender };
  }

  /* ---------- RAD-01 Seleção de tripulante ---------- */
  M.define({ id: 'RAD-01', key: 'rad.selecao', title: 'Seleção de tripulante', size: 'full', bare: true,
    render(b, c) {
      b.innerHTML = `<div class="crew-bar" role="group" aria-label="Selecionar tripulante">${c.crews.map(x => { const p = R.project({ ...c.plan, prior: RP.prior[x.id] || 0 }); return `<button data-c="${x.id}" aria-pressed="${x.id === c.crew.id}"><span class="avatar" style="background:${U.crewColor(x.id)}">${U.initials(x.name)}</span><span><b>${esc(x.name)}</b><small>${fmt(p.total, 0)} mSv projetados</small></span></button>`; }).join('')}</div>`;
      b.querySelectorAll('button').forEach(btn => btn.onclick = () => { c.S.crewId = +btn.dataset.c; c.rerender(); });
    } });

  /* ---------- RAD-02 Orçamento de dose da carreira ---------- */
  M.define({ id: 'RAD-02', key: 'rad.orcamento', title: 'Orçamento de dose da carreira', sub: 'Quanto do limite de 600 mSv já foi usado e quanto o plano da missão vai usar', size: 'xl',
    render(b, c) {
      const P = c.proj, plan = c.plan;
      const segs = [
        { k: 'prior', name: 'Missões anteriores', v: plan.prior, cls: 'sg-prior', note: 'suposição' },
        { k: 'sofar', name: `Esta missão até hoje (${plan.elapsedDays} dias de trânsito)`, v: P.transitSoFar, cls: 'sg-sofar', note: 'modelo RAD' },
        { k: 'surf', name: `Superfície, na base (${plan.surfaceDays} dias)`, v: P.surface, cls: 'sg-surf', note: 'planejado' },
        { k: 'ret', name: `Retorno à Terra (${plan.returnDays} dias)`, v: P.ret, cls: 'sg-ret', note: 'planejado' },
        { k: 'eva', name: `Acréscimo das saídas (${plan.sorties}×${fmt(plan.hours, 1)} h)`, v: P.evaExtra, cls: 'sg-eva', note: 'planejado' },
      ];
      const max = Math.max(RC.LIMIT * 1.15, P.total * 1.05), pos = v => (v / max * 100).toFixed(2);
      let acc = 0;
      const bar = segs.map(s => { const x = acc; acc += s.v; return s.v > 0 ? `<i class="${s.cls}" style="left:${pos(x)}%;width:${pos(s.v)}%" title="${esc(s.name)}: ${fmt(s.v, 1)} mSv"></i>` : ''; }).join('');
      const dos = A.lastCum(c.crew.id);
      b.innerHTML = `<div class="budget">
        <div class="bg-track">${bar}<span class="bg-mark caut" style="left:${pos(RC.CAUTION * RC.LIMIT)}%"><em>${Math.round(RC.CAUTION * RC.LIMIT)}</em></span><span class="bg-mark lim" style="left:${pos(RC.LIMIT)}%"><em>Limite ${RC.LIMIT} mSv</em></span></div>

          <label>Missões anteriores<span class="unit-wrap"><input class="inp" type="number" min="0" max="600" step="1" data-k="prior" value="${plan.prior}"><em>mSv</em></span></label>

          <label>Dias de retorno<span class="unit-wrap"><input class="inp" type="number" min="0" max="400" step="1" data-k="returnDays" value="${plan.returnDays}"><em>dias</em></span></label>
        </div>
        <p class="vnote">Dose na missão estimada com as taxas medidas pelo instrumento RAD da Curiosity: ${fmt(RC.RATE_CRUISE, 2)} mSv/dia em trânsito e ${fmt(RC.RATE_SURFACE, 2)} mSv/dia na superfície. Missões anteriores: valor de demonstração, edite acima. ${dos ? `O dosímetro da base sintética marca só ${fmt(dos.cum, 2)} mSv em ${plan.elapsedDays} dias, muito abaixo do medido no espaço profundo; por isso a estimativa usa a taxa da RAD.` : ''}</p>

  /* ---------- RAD-03 Dose projetada (velocímetro) ---------- */
  M.define({ id: 'RAD-03', key: 'rad.projetada', title: 'Dose de carreira projetada', sub: 'Ao fim da missão, com o plano atual', size: 'm',

  /* ---------- RAD-10 Trajetória da dose de carreira ----------
     Dose efetiva acumulada por dia de missão: linha cheia = já recebida, tracejada = projeção do plano.
     Mesmos números de R.project (RAD-02/03); aqui o eixo é o tempo, para ver QUANDO o limite é cruzado. */
  const TJ_PHASE = ['no trânsito de ida', 'na estadia na superfície', 'no retorno à Terra'];
  M.define({ id: 'RAD-10', key: 'rad.trajetoria', title: 'Trajetória da dose de carreira', sub: 'Dose efetiva já recebida e projeção até o fim da missão, contra o limite da NASA', size: 'full',
    render(b, c) {
      const P = c.proj, plan = c.plan, LIM = RC.LIMIT, CAU = RC.CAUTION * RC.LIMIT;
      const d1 = plan.elapsedDays, d2 = d1 + plan.surfaceDays, d3 = d2 + plan.returnDays, D = Math.max(d3, 1);
      const pts = [[0, plan.prior], [d1, P.toDate], [d2, P.toDate + P.surface + P.evaExtra], [d3, P.total]];  // acréscimo das saídas distribuído pela superfície
      /* Cruzamento do limite: seg -1 = antes da missão, 0 = já na ida (passado), 1 = superfície, 2 = retorno */
      let cross = null;
      if (plan.prior > LIM) cross = { day: 0, seg: -1 };
      else for (let i = 1; i < pts.length; i++) {
        const [x0, y0] = pts[i - 1], [x1, y1] = pts[i];
        if (y0 <= LIM && y1 > LIM) { cross = { day: x0 + (x1 - x0) * (LIM - y0) / (y1 - y0), seg: i - 1 }; break; }
      }
      const lvl = P.total > LIM ? 2 : P.total > CAU ? 1 : 0, past = cross && cross.seg <= 0, left = d3 - d1;
      const crossDay = cross ? Math.max(1, Math.ceil(cross.day)) : null;
      const head = !cross ? ['Dentro do limite de carreira', 'Perto do limite de carreira'][lvl] : past ? 'Limite de carreira já excedido' : 'Vai exceder o limite de carreira';
      const text = !cross
        ? `Termina a missão com ${fmt(P.pct * 100, 0)}% do limite e margem de ${fmt(P.margin, 0)} mSv.${lvl ? ' Dias extras ou um evento solar podem levar acima do limite.' : ''}`
        : past ? `A dose já recebida passa de ${LIM} mSv. O plano termina ${fmt(-P.margin, 0)} mSv acima do limite.`
          : `Cruza ${LIM} mSv no dia ${crossDay} da missão, ${TJ_PHASE[cross.seg]} (hoje é o dia ${d1}). Termina ${fmt(-P.margin, 0)} mSv acima do limite.`;

      const W = 960, H = 250, L = 44, Rr = 84, T = 20, B = 44, iw = W - L - Rr, ih = H - T - B;
      const ymax = Math.ceil(Math.max(LIM * 1.15, P.total * 1.08) / 100) * 100;
      const x = d => L + iw * d / D, y = v => T + ih * (1 - Math.min(v, ymax) / ymax), f1 = n => n.toFixed(1);
      const line = arr => arr.map((p, i) => `${i ? 'L' : 'M'}${f1(x(p[0]))} ${f1(y(p[1]))}`).join('');
      const area = (arr, base) => arr.length < 2 ? '' : `${line(arr)}L${f1(x(arr[arr.length - 1][0]))} ${f1(y(base))}L${f1(x(arr[0][0]))} ${f1(y(base))}Z`;
      const xp = cross && [cross.day, LIM];
      const before = !cross ? pts.slice(1) : past ? [] : [pts[1], ...pts.slice(2, cross.seg + 1), xp];
      const after = !cross ? [] : past ? pts.slice(1) : [xp, ...pts.slice(cross.seg + 1)];
      const nice = (span, opts, n) => opts.find(s => span / s <= n) || opts[opts.length - 1];
      const ys = nice(ymax, [100, 200, 250, 500, 1000, 2000], 5), xs = nice(D, [5, 10, 20, 25, 50, 100, 200, 500], 9);
      let yt = '', xt = '';
      for (let v = 0; v <= ymax; v += ys) yt += `<line class="sw-grid" x1="${L}" x2="${W - Rr}" y1="${f1(y(v))}" y2="${f1(y(v))}"/><text class="sw-ax" x="${L - 6}" y="${f1(y(v) + 3)}" text-anchor="end">${v}</text>`;
      for (let d = 0; d <= D; d += xs) xt += `<text class="sw-ax" x="${f1(x(d))}" y="${H - B + 14}" text-anchor="middle">${d}</text>`;
      const phases = [[0, d1, 'Trânsito de ida'], [d1, d2, 'Superfície'], [d2, d3, 'Retorno']].filter(p => x(p[1]) - x(p[0]) > 64)
        .map(p => `<text class="tj-ph" x="${f1((x(p[0]) + x(p[1])) / 2)}" y="${H - 8}" text-anchor="middle">${p[2]}</text>`).join('');
      const cx = cross && x(cross.day), farLeft = cross && cx < L + 300;
      const svg = `<svg class="tjchart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Dose efetiva acumulada por dia de missão, recebida e projetada, contra o limite de carreira">
        <rect class="tj-zone" x="${L}" y="${f1(y(ymax))}" width="${iw}" height="${f1(y(LIM) - y(ymax))}"/>
        ${d2 > d1 ? `<rect class="tj-band" x="${f1(x(d1))}" y="${f1(y(LIM))}" width="${f1(x(d2) - x(d1))}" height="${f1(y(0) - y(LIM))}"/>` : ''}
        ${yt}${xt}${phases}
        <text class="sw-ax" x="${W - 4}" y="${H - 8}" text-anchor="end">dia da missão</text><text class="sw-ax" x="${L}" y="11">mSv</text>
        <path class="tj-area-p" d="${area(pts.slice(1), 0)}"/><path class="tj-area" d="${area(pts.slice(0, 2), 0)}"/>
        ${after.length ? `<path class="tj-excess" d="${area(after, LIM)}"/>` : ''}
        <line class="tj-cau" x1="${L}" x2="${W - Rr}" y1="${f1(y(CAU))}" y2="${f1(y(CAU))}"/><text class="tj-cau-t" x="${L + 6}" y="${f1(y(CAU) + 13)}">${Math.round(RC.CAUTION * 100)}% do limite</text>
        <line class="tj-lim" x1="${L}" x2="${W - Rr}" y1="${f1(y(LIM))}" y2="${f1(y(LIM))}"/><text class="tj-lim-t" x="${L + 6}" y="${f1(y(LIM) - 6)}">Limite ${LIM} mSv</text>
        ${before.length > 1 ? `<path class="tj-proj" d="${line(before)}"/>` : ''}${after.length > 1 ? `<path class="tj-over" d="${line(after)}"/>` : ''}
        <path class="tj-got" d="${line(pts.slice(0, 2))}"/>
        <line class="sw-now" x1="${f1(x(d1))}" x2="${f1(x(d1))}" y1="${T}" y2="${T + ih}"/><text class="sw-now-t" x="${f1(x(d1) + 5)}" y="${T + ih - 6}">hoje</text>
        <circle class="tj-now-dot" cx="${f1(x(d1))}" cy="${f1(y(P.toDate))}" r="5"><title>Recebida até hoje: ${fmt(P.toDate, 0)} mSv</title></circle>
        ${cross && !past ? `<circle class="tj-x-ring" cx="${f1(cx)}" cy="${f1(y(LIM))}" r="7"/><circle class="tj-x" cx="${f1(cx)}" cy="${f1(y(LIM))}" r="6"/><text class="tj-x-t" x="${f1(farLeft ? cx + 12 : cx - 12)}" y="${f1(farLeft ? y(LIM) + 17 : y(LIM) - 9)}" text-anchor="${farLeft ? 'start' : 'end'}">Cruza o limite no dia ${crossDay}</text>` : ''}
        <circle class="tj-end l${lvl}" cx="${f1(x(d3))}" cy="${f1(y(P.total))}" r="5.5"/><text class="tj-end-t l${lvl}" x="${f1(x(d3) + 10)}" y="${f1(y(P.total) + 4)}">${fmt(P.total, 0)} mSv</text>
      </svg>`;
      b.innerHTML = `<div class="tj">
        <div class="tj-top">
          <div class="tj-status l${lvl}"><span class="tj-ic">${icon(lvl ? 'warn' : 'check')}</span><div><strong>${head}</strong><p>${text}</p></div></div>
          <div class="tj-kpis">
            <div><span>Recebida até hoje</span><b class="num">${fmt(P.toDate, 0)} mSv</b><small>${fmt(P.toDate / LIM * 100, 0)}% do limite</small></div>
            <div><span>Ainda a receber no plano</span><b class="num">${fmt(P.total - P.toDate, 0)} mSv</b><small>${left === 1 ? '1 dia restante' : `${left} dias restantes`}</small></div>
            <div class="l${lvl}"><span>Ao fim da missão</span><b class="num">${fmt(P.total, 0)} mSv</b><small>${P.margin >= 0 ? `Margem de ${fmt(P.margin, 0)} mSv` : `Excede em ${fmt(-P.margin, 0)} mSv`}</small></div>
          </div>
        </div>
        ${svg}
        <div class="legend"><span><i style="background:var(--accent)"></i>Dose já recebida</span><span><i style="height:2px;border-top:2px dashed var(--accent);background:none"></i>Projeção do plano</span><span><i style="background:var(--crit)"></i>Acima do limite</span></div>
        <p class="vnote">Dose efetiva (mSv), a grandeza do limite de carreira; não é a dose absorvida (Gy), que mede só a energia depositada. Já recebida: missões anteriores (suposição) mais o trânsito até hoje, pela taxa medida pelo instrumento RAD. Projeção: dias planejados vezes as taxas medidas; o acréscimo das saídas é distribuído pela estadia na superfície.</p>
      </div>`;
    } });

  /* ---------- RAD-04 Planejar saída da base ---------- */
  const VERD = { go: ['Pode seguir', 'l0', 'check'], caution: ['Seguir com cautela', 'l1', 'warn'], nogo: ['Não seguir agora', 'l2', 'warn'] };
  M.define({ id: 'RAD-04', key: 'rad.saida', title: 'Planejar saída da base', sub: 'Atividade extraveicular em Marte: dose esperada e recomendação', size: 'full',
    render(b, c) {

    } });

  /* ---------- RAD-05 Atividade solar e eventos (dados reais) ---------- */
  M.define({ id: 'RAD-05', key: 'rad.solar', title: 'Atividade solar e eventos de partículas', sub: 'Dados reais: manchas solares (NOAA) e eventos SEP registrados pela NASA (DONKI)', size: 'full',
    render(b, c, el) {
      const s = SW();
      if (!s) { b.innerHTML = '<div class="empty"><b>Sem dados de clima espacial</b>Rode scripts/fetch_space_weather.py e web/prep_data.py.</div>'; return; }
      el.querySelector('.mod-x').innerHTML = `<span class="chip l0">Dado real</span>`;
      const model = R.sepModel(s), now = nowMonth();
      const months = []; { let [y, mo] = [2019, 12]; while (y < 2031) { months.push(`${y}-${String(mo).padStart(2, '0')}`); mo++; if (mo > 12) { mo = 1; y++; } } }
      const W = 960, H = 230, L = 34, Rr = 10, T = 30, B = 26, iw = W - L - Rr, ih = H - T - B, ymax = 220;
      const x = mth => L + iw * months.indexOf(mth) / (months.length - 1), y = v => T + ih * (1 - Math.min(v, ymax) / ymax);

      const pred = s.pred.filter(m => m[0] >= months[0] && m[0] <= months[months.length - 1]);
      const line = (arr, i) => arr.map((m, k) => `${k ? 'L' : 'M'}${x(m[0]).toFixed(1)} ${y(m[i]).toFixed(1)}`).join('');
      const band = pred.length ? `M${pred.map(m => `${x(m[0]).toFixed(1)} ${y(m[3]).toFixed(1)}`).join('L')}L${pred.slice().reverse().map(m => `${x(m[0]).toFixed(1)} ${y(m[2]).toFixed(1)}`).join('L')}Z` : '';

      const yt = [0, 50, 100, 150, 200].map(v => `<line class="sw-grid" x1="${L}" x2="${W - Rr}" y1="${y(v)}" y2="${y(v)}"/><text class="sw-ax" x="${L - 6}" y="${y(v) + 3}" text-anchor="end">${v}</text>`).join('');
      const xt = [2020, 2022, 2024, 2026, 2028, 2030].map(yr => `<text class="sw-ax" x="${x(yr + '-01')}" y="${H - 8}" text-anchor="middle">${yr}</text>`).join('');
      const mis = A.DB.missions[0], ms = mis.start.slice(0, 7), me = mis.end.slice(0, 7);

        <rect class="sw-mis" x="${x(ms)}" y="${T}" width="${Math.max(3, x(me) - x(ms))}" height="${ih}"><title>Missão ${esc(mis.name)} (fictícia)</title></rect>
        ${band ? `<path class="sw-band" d="${band}"/>` : ''}
        <path class="sw-obs" d="${line(obs, 1)}"/><path class="sw-sm" d="${line(sm, 2)}"/>${pred.length ? `<path class="sw-pred" d="${line(pred, 1)}"/>` : ''}
        ${covBar}${dots}

        <text class="sw-ax" x="${L}" y="12">eventos SEP medidos (NASA DONKI)${cov0 ? `, cobertura ${cov0.replace('-', '/')} a ${cov1.replace('-', '/')}` : ''}</text>
      </svg>`;
      const next = []; { let [yy, mm] = now.split('-').map(Number); for (let i = 0; i < 12; i++) { const k = `${yy}-${String(mm).padStart(2, '0')}`, ss = ssnFor(k); next.push([k, ss, ss == null ? null : model.pMonth(ss)]); mm++; if (mm > 12) { mm = 1; yy++; } } }
      const MES = window.I18N.months();

      b.innerHTML = `<div class="sw">

    root.querySelector('#cpj').onclick = async () => { const ok = await copyText(JSON.stringify({ crew: A.DB.crew, records: A.DB.userRecords }, null, 1)); window.APP.toast(ok ? 'JSON copiado' : 'Não foi possível copiar.'); };
    root.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { const rid = b.dataset.del, rec = A.DB.userRecords.find(x => x.id === rid); window.APP.confirm('Excluir este registro?', 'Todas as medições salvas no mesmo envio serão removidas.', 'Excluir', () => { A.removeRecordGroup(rec.group); window.APP.refreshHeader(); render(root); window.APP.toast('Registro excluído'); }); });
    root.querySelector('#rs').onclick = () => window.APP.confirm('Restaurar a base de demonstração?', 'Seus registros e tripulantes adicionados neste navegador serão apagados.', 'Restaurar', () => { A.resetUser(); window.VIEWS.registrar.reset(); window.APP.refreshHeader(); render(root); window.APP.toast('Base restaurada'); });
  }
  V.registros = { render };

  /* ---------- Método ---------- */
  function band(m) { return m.ok ? `${fmt(m.ok[0], m.dec)}–${fmt(m.ok[1], m.dec)}` : '—'; }
  V.metodo = { render(root) {
    root.innerHTML = `<div class="stack view-in"><div class="grid g2">
      <div class="card"><div class="card-b prose"><h3 style="margin-top:0">Como o diagnóstico é calculado</h3>
        <p>Cada medida passa por duas comparações e fica com o pior resultado das duas.</p>
        <p><b>1. Faixa de referência.</b> Um intervalo de triagem para adultos. Dentro: normal. Na faixa ampliada: atenção. Fora: crítico.</p>
        <p><b>2. Seu padrão.</b> A mediana e o desvio robusto (MAD × 1,4826) dos primeiros ${A.BASE_DAYS} dias de missão do próprio tripulante. Desvio de 2σ ou mais na direção adversa gera atenção. Para métricas sem faixa de referência, 3σ ou mais gera nível crítico.</p>
        <p>Quando o tripulante tem menos de ${A.MIN_N} medições no período de referência (como nos exames quinzenais), o padrão vem da coorte, e o nível máximo é atenção.</p>
        <h3>Eventos persistentes</h3><p>Dias seguidos em que a média diária de uma métrica fica no mínimo X desvios do padrão, na direção adversa. É a mesma regra do módulo Python de detecção.</p>
        <h3>Padrões combinados</h3><p>Regras que ligam indicadores a riscos de missão da NASA (radiação, isolamento, ambiente fechado, perda óssea e cardiovascular).</p></div></div>
      <div class="stack"><div class="card"><div class="card-b prose"><h3 style="margin-top:0">Origem dos dados</h3>
        <div class="callout">${icon('warn')}<div>A base carregada é <b>sintética</b> (90 dias da missão fictícia Ares Pathfinder, 6 tripulantes). Serve para demonstrar a plataforma, não para afirmar nada sobre astronautas reais.</div></div>
        <p>Medições registradas no formulário ficam rotuladas como <i>Inserido</i> e não se misturam com a base de demonstração na exportação.</p>
        <h3>Limitações</h3><ul><li>As faixas de referência são padrões do protótipo. Em uso real devem vir do médico de voo e do NASA-STD-3001.</li><li>Não é dispositivo médico nem diagnóstico clínico.</li><li>O armazenamento é local ao navegador, sem sincronização entre dispositivos.</li><li>O limite de carreira de radiação (600 mSv) vem do NASA-STD-3001 Vol. 1 Rev B; antes de uso real, confira a revisão vigente.</li></ul></div></div></div></div>
      <div class="card"><div class="card-h"><div><h3>Faixas de referência por indicador</h3><p>Valores usados para o estado normal, atenção e crítico.</p></div></div><div class="card-b" style="padding:12px 0 0"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Indicador</th><th>Categoria</th><th>Unidade</th><th class="r">Normal</th><th class="r">Atenção até</th><th>Direção adversa</th></tr></thead><tbody>${A.MET.map(m => `<tr><td>${esc(m.label)}</td><td>${A.CATS[m.cat].short}</td><td>${esc(m.unit)}</td><td class="r">${band(m)}</td><td class="r">${m.warn ? fmt(m.warn[0], m.dec) + '–' + fmt(m.warn[1], m.dec) : m.pct ? `variação ≥ ${m.pct[0]}% (crítico ≥ ${m.pct[1]}%)` : 'só desvio do padrão'}</td><td>${m.bad === 'both' ? 'Ambas' : m.bad === 'high' ? 'Acima' : 'Abaixo'}</td></tr>`).join('')}</tbody></table></div></div></div></div>`;
  } };
})();

/* =========================================================
   Aurora (by Athenance): shell, rotas e utilitários globais
   ========================================================= */
(function () {
  const A = window.AT, U = window.UI, { esc, icon } = U;
  const state = { crewId: null, metric: 'hr' };
  const PAGES = {
    tripulante: { nav: 'Tripulante', ic: 'user', title: 'Saúde do tripulante', sub: 'Acompanhamento integrado de cada tripulante ao longo da missão.' },
    registrar: { nav: 'Registrar medições', ic: 'form', title: 'Registrar medições', sub: 'Informe seus indicadores de saúde. Você recebe na hora um diagnóstico comparado ao seu padrão pessoal.' },
    radiacao: { nav: 'Radiação', ic: 'rad', title: 'Radiação', sub: 'Dose de carreira, planejamento de saídas em Marte e atividade solar com dados reais.' },
    analise: { nav: 'Análise exploratória', ic: 'chart', title: 'Análise exploratória', sub: 'Padrões e relações nos dados da tripulação, durante e depois da missão.' },
    registros: { nav: 'Registros', ic: 'table', title: 'Registros e exportação', sub: 'Histórico por categoria, origem dos dados e exportação para o seu pipeline.' },
    metodo: { nav: 'Método e limites', ic: 'book', title: 'Método e limites', sub: 'Como cada resultado é calculado e o que a base de demonstração representa.' },
  };
  const LS_THEME = 'athenance.theme';
  const route = () => { const h = (location.hash || '').slice(1); return PAGES[h] ? h : 'tripulante'; };  // tela inicial = primeira do menu

  function logo() { return window.BRAND.logo('side'); }

  const T = (s, v) => window.I18N.t(s, v);

  function langSwitch() {
    const L = window.I18N.LANGS, cur = window.I18N.lang;
    return `<div class="lang" role="group" aria-label="${T('Idioma')}">${icon('globe')}${Object.entries(L).map(([k, x]) => `<button type="button" data-lang="${k}" aria-pressed="${k === cur}" title="${x.name}">${x.short}</button>`).join('')}</div>`;
  }

  function shell() {
    document.getElementById('root').innerHTML = `<div class="app"><aside class="side" data-mod="APP-01" data-title="${T('Menu lateral')}">
      <div class="brand">${logo()}<div><b>Aurora</b><span>by Athenance</span></div></div>
      <div><div class="nav-group">${T('Plataforma')}</div><nav class="nav" aria-label="${T('Principal')}">${Object.entries(PAGES).map(([k, p]) => `<a href="#${k}" data-r="${k}">${icon(p.ic)}<span>${T(p.nav)}</span></a>`).join('')}</nav></div>
      <div class="side-foot"><div class="demo-tag"><i></i><span>${T('Dados de demonstração sintéticos. Não são de astronautas reais.')}</span></div>
        ${window.MOD.DEV ? `<button class="btn ghost sm ref-btn" data-refbtn aria-pressed="false" title="${T('Mostra o ID de cada caixa (atalho Alt+R)')}">${icon('grid')}<span>${T('Modo referência')}</span></button>` : ''}
        <div class="row"><span>NASA Space Apps 2026</span><button class="btn ghost sm" id="theme" aria-label="${T('Alternar tema')}"></button></div></div></aside>
      <main class="main" id="main"><header class="top" data-mod="APP-02" data-title="${T('Cabeçalho da tela')}"><div><h1 id="h1"></h1><p id="sub"></p></div><div class="top-r"><div id="langsw" data-mod="APP-04" data-title="${T('Idioma')}">${langSwitch()}</div><div class="ctx" id="ctx"></div></div></header><div class="scn-banner" id="scnb" data-mod="APP-03" data-title="${T('Aviso de cenário ativo')}" role="status" hidden></div><div class="i18n-note" id="i18nnote" hidden></div><div id="view"></div></main></div>`;
    document.getElementById('theme').onclick = toggleTheme; paintTheme();
    if (window.MOD.DEV) { document.querySelector('[data-refbtn]').onclick = () => window.MOD.setRef(!window.MOD.isRef()); window.MOD.setRef(window.MOD.isRef()); }
    document.querySelectorAll('[data-lang]').forEach(b => b.onclick = () => setLang(b.dataset.lang));
  }
  function setLang(l) { window.I18N.set(l); shell(); refreshHeader(); render(); }
  function paintTheme() { const t = document.documentElement.dataset.theme || 'dark'; const b = document.getElementById('theme'); if (b) b.innerHTML = icon(t === 'dark' ? 'sun' : 'moon') + T(t === 'dark' ? 'Claro' : 'Escuro'); }
  function toggleTheme() { const t = (document.documentElement.dataset.theme || 'dark') === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = t; try { localStorage.setItem(LS_THEME, t); } catch (e) {} paintTheme(); render(); }

  function refreshHeader() {
    const last = A.lastDate(), m = A.DB.missions[0];
    document.getElementById('ctx').innerHTML = `<div><span>${T('Missão')}</span><strong>${esc(m.name)}</strong></div><div><span>${T('Fase')}</span><strong>${A.PHASE_PT[A.phaseForDate(last)]}</strong></div><div><span>${T('Último registro')}</span><strong class="num">${U.fmtDT(last)}</strong></div>`;
  }

  function render() {
    const r = route(), p = PAGES[r], V = window.VIEWS[r];
    document.querySelectorAll('.nav a').forEach(a => { if (a.dataset.r === r) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
    const res = r === 'registrar' && window.VIEWS.registrar.form.result;
    document.getElementById('h1').textContent = res ? T('Diagnóstico do registro') : T(p.title);
    document.getElementById('sub').textContent = res ? T('Resultado imediato, comparado com a faixa de referência e com o seu padrão pessoal.') : T(p.sub);
    document.title = (res ? T('Diagnóstico') : T(p.title)) + ' · Aurora';
    const note = document.getElementById('i18nnote'), I = window.I18N;
    note.hidden = true; note.innerHTML = '';
    tipHideAll(); const vw = document.getElementById('view'); V.render(vw); window.MOD.tagLegacy(vw, r); window.SCN.renderBanner(); window.MOD.tagAll();
    if (!I.TRANSLATED.has(r)) I.watch(vw); else I.watch(null);  // telas sem T() no código: tradução no nível da página
  }
  const tipHideAll = () => U.tipHide();

  /* ---------- Toast e modais ---------- */
  let tt;
  function toast(msg) { let el = document.querySelector('.toast'); if (!el) { el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role', 'status'); document.body.appendChild(el); } el.innerHTML = icon('check') + `<span>${esc(msg)}</span>`; el.querySelector('svg').setAttribute('style', 'width:16px;height:16px;stroke:var(--good-ink);fill:none;stroke-width:2.2'); requestAnimationFrame(() => el.classList.add('on')); clearTimeout(tt); tt = setTimeout(() => el.classList.remove('on'), 2600); }
  function modal(html, onMount) {
    const bg = document.createElement('div'); bg.className = 'modal-bg'; bg.innerHTML = `<div class="card modal" role="dialog" aria-modal="true">${html}</div>`; document.body.appendChild(bg);
    const close = () => bg.remove(); bg.addEventListener('mousedown', e => { if (e.target === bg) close(); }); bg.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
    onMount(bg, close); const f = bg.querySelector('input,button'); if (f) f.focus();
  }
  function confirmBox(title, text, okLabel, onOk) {
    modal(`<h3>${esc(title)}</h3><p class="muted" style="margin:6px 0 0">${esc(text)}</p><div class="btns"><button class="btn" data-x>Cancelar</button><button class="btn primary" data-ok>${esc(okLabel)}</button></div>`, (bg, close) => { bg.querySelector('[data-x]').onclick = close; bg.querySelector('[data-ok]').onclick = () => { close(); onOk(); }; });
  }
  function crewModal(done) {
    modal(`<h3>Novo tripulante</h3><p class="muted small" style="margin:4px 0 0">O padrão pessoal aparece depois de ${A.MIN_N} medições. Até lá, usamos a coorte como referência.</p><div class="fields" style="grid-template-columns:1fr 1fr"><div class="field span2"><label for="n-name">Nome</label><input class="inp" id="n-name" autocomplete="off"></div><div class="field"><label for="n-role">Função</label><input class="inp" id="n-role" value="Mission Specialist"></div><div class="field"><label for="n-age">Idade</label><input class="inp" id="n-age" inputmode="numeric" value="35"></div><div class="field span2"><label for="n-sex">Sexo</label><select class="sel" id="n-sex" style="width:100%"><option value="F">Feminino</option><option value="M">Masculino</option></select></div></div><div class="err" id="n-err" style="color:var(--crit-ink);font-size:12px;margin-top:8px"></div><div class="btns"><button class="btn" data-x>Cancelar</button><button class="btn primary" data-ok>Adicionar</button></div>`, (bg, close) => {
      bg.querySelector('[data-x]').onclick = close;
      bg.querySelector('[data-ok]').onclick = () => { const name = bg.querySelector('#n-name').value.trim(), age = parseInt(bg.querySelector('#n-age').value, 10); if (name.length < 2) { bg.querySelector('#n-err').textContent = 'Informe o nome do tripulante.'; return; } if (!(age >= 18 && age <= 80)) { bg.querySelector('#n-err').textContent = 'Idade entre 18 e 80 anos.'; return; } const c = A.addCrew({ name, role: bg.querySelector('#n-role').value.trim() || 'Crew', age, sex: bg.querySelector('#n-sex').value }); close(); toast(name + ' adicionado'); done(c); };
    });
  }

  window.APP = { state, render, refreshHeader, toast, confirm: confirmBox, crewModal };

  function init() {
    A.loadSeed(); A.loadUser();
    let th = 'dark'; try { th = localStorage.getItem(LS_THEME) || 'dark'; } catch (e) {}
    document.documentElement.dataset.theme = th;
    window.VIEWS.registrar.reset(); state.crewId = A.DB.crew[0].id;
    window.MOD.initRef(); window.BRAND.favicon(); window.I18N.applyEngine();
    shell(); refreshHeader(); render();
    window.addEventListener('hashchange', () => { render(); window.scrollTo(0, 0); });
  }
  init();
})();

</script>
</body>
</html>
