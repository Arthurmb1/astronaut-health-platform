"Em ambiente fechado, infecções se espalham com facilidade e o sistema imune fica modulado pelo voo. Febre é um alerta precoce.": "In a closed environment, infections spread easily and spaceflight modulates the immune system. Fever is an early warning.",
"Isole-se do convívio próximo, hidrate-se e repita em 2 horas. Acima de 38,0 °C ou com sintomas, acione o médico de voo.": "Keep distance from the crew, hydrate and repeat in 2 hours. Above 38.0 °C or with symptoms, contact the flight surgeon.",
"Aqueça o ambiente e repita a medida. Abaixo de 35,5 °C, acione o médico de voo.": "Warm up the environment and repeat the measurement. Below 35.5 °C, contact the flight surgeon.",
"Percentual de hemoglobina carregando oxigênio, medido com oxímetro de dedo.": "Percentage of hemoglobin carrying oxygen, measured with a finger pulse oximeter.",
"Mudanças na atmosfera da cabine ou falha no suporte de vida aparecem primeiro aqui.": "Changes in cabin atmosphere or life support failures show up here first.",
"Repita a medida com a mão aquecida e parada. Verifique O₂ e CO₂ da cabine. Abaixo de 92%, acione o médico de voo imediatamente.": "Repeat with a warm, still hand. Check cabin O₂ and CO₂. Below 92%, contact the flight surgeon immediately.",
"Massa medida com o dispositivo de massa corporal da estação, mesma hora e mesma roupa.": "Mass measured with the station body mass device, same time and same clothing.",
"Perda de massa sinaliza ingestão calórica insuficiente, que é comum em voo e acelera a perda muscular e óssea.": "Mass loss signals insufficient calorie intake, which is common in flight and speeds up muscle and bone loss.",
"Revise a ingestão calórica e a retenção de líquidos e repita a medida em 24 horas.": "Review calorie intake and fluid retention and repeat the measurement in 24 hours.",
"Revise a ingestão calórica e de proteínas e confira o treino de resistência. Perda acima de 5% pede avaliação nutricional com o médico de voo.": "Review calorie and protein intake and check resistance training. A loss above 5% calls for a nutrition review with the flight surgeon.",
"Glicose no sangue capilar, em jejum pela manhã.": "Capillary blood glucose, fasting in the morning.",
"O estresse e a inatividade alteram a sensibilidade à insulina; é um indicador simples de metabolismo e nutrição.": "Stress and inactivity change insulin sensitivity; it is a simple marker of metabolism and nutrition.",
"Confirme em jejum, revise açúcares da última refeição e repita no dia seguinte. Acima de 125 mg/dL em jejum, informe o médico de voo.": "Confirm while fasting, review sugars in the last meal and repeat the next day. Above 125 mg/dL fasting, tell the flight surgeon.",
"Ingira carboidrato de ação rápida e repita em 15 minutos. Abaixo de 60 mg/dL ou com sintomas, acione o médico de voo.": "Take fast-acting carbohydrate and repeat in 15 minutes. Below 60 mg/dL or with symptoms, contact the flight surgeon.",
"Horas dormidas nas últimas 24 horas, por diário de sono ou dispositivo.": "Hours slept in the last 24 hours, from a sleep log or device.",
"O ciclo luz-escuro artificial, o ruído e a carga de trabalho reduzem o sono em missões. Sono curto prejudica atenção, humor e imunidade.": "Artificial light-dark cycles, noise and workload cut sleep in missions. Short sleep impairs attention, mood and immunity.",
"Proteja a janela de sono, reduza luz azul 1 hora antes de dormir e evite cafeína à tarde. Se faltar sono por 3 noites seguidas, converse com o médico de voo.": "Protect your sleep window, cut blue light 1 hour before bed and avoid caffeine in the afternoon. If sleep is short 3 nights in a row, talk to the flight surgeon.",
"Sono muito longo repetido pode indicar fadiga ou humor rebaixado. Observe nos próximos dias.": "Repeated very long sleep may indicate fatigue or low mood. Watch it over the next days.",
"Proporção do tempo na cama em que você realmente dormiu.": "Share of time in bed that you actually slept.",
"Eficiência baixa indica sono fragmentado, comum com ruído, calor ou ansiedade.": "Low efficiency means fragmented sleep, common with noise, heat or worry.",
"Cheque ruído, temperatura e iluminação da cabine de dormir. Use rotina fixa de deitar e levantar.": "Check noise, temperature and lighting in the sleep station. Keep fixed bed and wake times.",
"Autoavaliação de 1 (muito ruim) a 5 (muito bom).": "Self-rating from 1 (very bad) to 5 (very good).",
"Isolamento e confinamento afetam o humor. A queda sustentada costuma vir antes de conflitos e erros operacionais.": "Isolation and confinement affect mood. A sustained drop often comes before conflicts and operational errors.",
"Fale com um colega de confiança, faça uma atividade de lazer ou contato com a Terra. Se a queda durar mais de 3 dias, converse com o suporte psicológico de voo.": "Talk to a trusted crewmate, do a leisure activity or contact Earth. If the drop lasts more than 3 days, talk to flight psychological support.",
"Autoavaliação de 1 (nenhum) a 5 (extremo).": "Self-rating from 1 (none) to 5 (extreme).",
"Estresse sustentado reduz o sono, eleva a pressão e prejudica o desempenho em tarefas críticas.": "Sustained stress reduces sleep, raises blood pressure and hurts performance on critical tasks.",
"Faça uma pausa guiada (respiração lenta por 5 minutos), ajuste a agenda e converse com a equipe. Estresse acima de 3,5 por 2 dias pede contato com o suporte psicológico de voo.": "Take a guided break (slow breathing for 5 minutes), adjust the schedule and talk to the team. Stress above 3.5 for 2 days calls for contacting flight psychological support.",
"Mediana do tempo de resposta em um teste psicomotor curto.": "Median response time in a short psychomotor test.",
"É um marcador objetivo de fadiga e de queda de atenção, menos sujeito a viés que o autorrelato.": "It is an objective marker of fatigue and attention loss, less biased than self-report.",
"Evite tarefas críticas até descansar. Repita o teste após uma pausa e priorize o sono nesta noite.": "Avoid critical tasks until you rest. Repeat the test after a break and prioritize sleep tonight.",
"Contagem de glóbulos brancos no sangue.": "White blood cell count.",
"O voo espacial altera a função imune. Aumento sugere infecção ou inflamação; queda sugere supressão imune.": "Spaceflight alters immune function. A rise suggests infection or inflammation; a drop suggests immune suppression.",
"Associe com temperatura e sintomas. Valor elevado persistente pede avaliação do médico de voo.": "Check it together with temperature and symptoms. A persistently high value calls for a flight surgeon review.",
"Reduza exposição a infecções e informe o médico de voo.": "Reduce exposure to infections and tell the flight surgeon.",
"Marcador sanguíneo de inflamação.": "Blood marker of inflammation.",
"Sobe com infecção, lesão e estresse; também está ligada ao risco cardiovascular.": "It rises with infection, injury and stress; it is also linked to cardiovascular risk.",
"Informe o médico de voo. Acima de 10 mg/L, considere infecção ou lesão ativa.": "Tell the flight surgeon. Above 10 mg/L, consider active infection or injury.",
"Hormônio do estresse, coletado pela manhã.": "Stress hormone, sampled in the morning.",
"Reflete a resposta ao estresse crônico e ao isolamento. Interpretamos pela mudança em relação ao seu padrão.": "It reflects the response to chronic stress and isolation. We read it as change from your baseline.",
"Revise carga de trabalho e sono. Mudança sustentada pede avaliação do médico de voo.": "Review workload and sleep. A sustained change calls for a flight surgeon review.",
"Queda marcada em relação ao seu padrão deve ser discutida com o médico de voo.": "A marked drop from your baseline should be discussed with the flight surgeon.",
"Reserva de vitamina D no sangue.": "Vitamin D level in the blood.",
"Sem luz solar, a vitamina D cai. Ela é essencial para a saúde óssea durante a perda de densidade do voo.": "Without sunlight, vitamin D drops. It is essential for bone health during in-flight density loss.",
"Revise a suplementação com o médico de voo.": "Review supplementation with the flight surgeon.",
"Marcador de degradação do colágeno ósseo.": "Marker of bone collagen breakdown.",
"Sobe quando o osso é reabsorvido mais rápido que formado, o que acontece em microgravidade.": "It rises when bone is resorbed faster than it is formed, which happens in microgravity.",
"Reforce o treino de resistência e a ingestão de cálcio e vitamina D, e informe o médico de voo.": "Step up resistance training and calcium and vitamin D intake, and tell the flight surgeon.",
"Carga do vírus Epstein-Barr na saliva.": "Epstein-Barr virus load in saliva.",
"O vírus latente reativa quando a imunidade cai sob estresse, um achado conhecido em astronautas.": "The latent virus reactivates when immunity drops under stress, a known finding in astronauts.",
"Reativação indica estresse imune. Descanse, revise o sono e informe o médico de voo.": "Reactivation indicates immune stress. Rest, review sleep and tell the flight surgeon.",
"Índice de Shannon da diversidade de bactérias intestinais.": "Shannon index of gut bacteria diversity.",
"Queda de diversidade acompanha mudanças de dieta e estresse e se relaciona com a imunidade.": "Loss of diversity follows diet changes and stress and relates to immunity.",
"Revise fibras e alimentos fermentados da dieta e informe o médico de voo se persistir.": "Review fiber and fermented foods in the diet and tell the flight surgeon if it persists.",
"Espessura da parede da carótida medida por ultrassom.": "Carotid wall thickness measured by ultrasound.",
"É um marcador de saúde vascular; o voo pode acelerar sinais de envelhecimento arterial.": "It is a marker of vascular health; spaceflight may speed up signs of arterial aging.",
"Informe o médico de voo para revisar o exame de ultrassom.": "Tell the flight surgeon so the ultrasound can be reviewed.",
"Radiação medida pelo dosímetro pessoal, em microsieverts por hora.": "Radiation measured by the personal dosimeter, in microsieverts per hour.",
"Fora da magnetosfera a radiação cósmica e solar é o principal risco de longo prazo. Picos podem indicar evento solar.": "Outside the magnetosphere, cosmic and solar radiation is the main long-term risk. Spikes may indicate a solar event.",
"Confira o alerta de clima espacial e, se necessário, abrigue-se na área mais blindada da nave.": "Check the space weather alert and, if needed, shelter in the most shielded area of the spacecraft.",
"Soma da dose recebida durante a missão. As faixas usam 50% e 80% do limite de carreira de 600 mSv (NASA-STD-3001 Vol. 1 Rev B).": "Total dose received during the mission. Ranges use 50% and 80% of the 600 mSv career limit (NASA-STD-3001 Vol. 1 Rev B).",
"O limite de carreira controla o risco de câncer e de efeitos no sistema nervoso e cardiovascular.": "The career limit controls the risk of cancer and of effects on the nervous and cardiovascular systems.",
"Informe o médico de voo e a equipe de planejamento: atividades externas podem precisar de ajuste.": "Tell the flight surgeon and the planning team: outside activities may need adjusting.",
"Concentração de dióxido de carbono no ar da cabine.": "Carbon dioxide concentration in cabin air.",
"Em ambiente fechado o CO₂ acumula perto do corpo e causa dor de cabeça, sono ruim e queda de desempenho.": "In a closed environment CO₂ builds up around the body and causes headache, poor sleep and lower performance.",
"Melhore a ventilação local, mude de posição no módulo e reporte ao controle da missão. Acima de 3000 ppm, trate como falha de suporte de vida.": "Improve local ventilation, move within the module and report to mission control. Above 3000 ppm, treat it as a life support failure.",

"Normal: o valor está na faixa de referência e perto do seu padrão pessoal. Atenção: saiu da faixa de referência ou se afastou do seu padrão; vale repetir a medida e observar. Crítico: está fora da faixa ampliada; acione o médico de voo. Hoje sua condição geral é {c}.": "Normal: the value is in the reference range and close to your personal baseline. Attention: it left the reference range or moved away from your baseline; repeat the measurement and keep watching. Critical: it is outside the extended range; contact the flight surgeon. Today your overall condition is {c}.",
"É a sua faixa típica, calculada com a mediana e a dispersão das suas medidas nos primeiros {n} dias da missão. Assim o sistema compara você com você mesmo, e não só com a média da população.": "It is your typical range, computed from the median and spread of your measurements in the first {n} days of the mission. This way the system compares you with yourself, not only with the population average.",
"Um alerta indica que algo mudou, não é um diagnóstico. Repita a medida nas mesmas condições e siga as ações sugeridas. Se o alerta persistir por 2 dias ou vier com sintomas, fale com o médico de voo.": "An alert means something changed; it is not a diagnosis. Repeat the measurement under the same conditions and follow the suggested actions. If the alert lasts 2 days or comes with symptoms, talk to the flight surgeon.",
"Dormir pouco aumenta o estresse, piora o tempo de reação e o humor e pode elevar a frequência cardíaca e a pressão. Por isso o sistema cruza o sono com esses indicadores no padrão \"Fadiga e estresse combinados\".": "Short sleep raises stress, worsens reaction time and mood, and can raise heart rate and blood pressure. That is why the system crosses sleep with these indicators in the \"Combined fatigue and stress\" pattern.",
"Fora do campo magnético da Terra, raios cósmicos e eventos solares aumentam o risco de câncer e de efeitos no coração e no sistema nervoso a longo prazo. A NASA limita a dose de carreira a 600 mSv; a tela Radiação mostra quanto do limite já foi usado.": "Outside Earth's magnetic field, cosmic rays and solar events raise the long-term risk of cancer and of effects on the heart and nervous system. NASA limits career dose to 600 mSv; the Radiation page shows how much of the limit has been used.",
"Não. Os dados dos tripulantes são sintéticos, criados para demonstração. Os limites de radiação e os dados de atividade solar da tela Radiação vêm de fontes reais da NASA e da NOAA.": "No. Crew data is synthetic, created for the demo. The radiation limits and solar activity data on the Radiation page come from real NASA and NOAA sources.",

"Na superfície, a blindagem barra só cerca de 7% dos raios cósmicos galácticos, então uma saída em dia calmo acrescenta pouca dose. O risco real de sair é um evento de partículas solares: a blindagem corta cerca de 50% dessa dose, e encerrar a saída em até 2 h com alerta de dosimetria em tempo real dá proteção muito alta (NASA OCHMO-TB-020). Em set/2017, a taxa na superfície subiu 2 a 3 vezes durante horas.": "On the surface, shielding blocks only about 7% of galactic cosmic rays, so an excursion on a quiet day adds little dose. The real risk of going out is a solar particle event: shielding cuts about 50% of that dose, and ending the excursion within 2 h with real-time dosimetry alerts gives very high protection (NASA OCHMO-TB-020). In Sep 2017, the surface dose rate rose 2 to 3 times for hours.",

  const DB = { crew: [], missions: [], phases: [], vitals: [], mental: [], labs: [], rad: [], env: [], events: [], version: 0 };

  /* ---------- Utilidades ---------- */
  const DAY = 864e5;

  const dayKey = s => s.slice(0, 10);
  const median = a => { if (!a.length) return NaN; const s = [...a].sort((x, y) => x - y), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
  const mean = a => a.reduce((x, y) => x + y, 0) / (a.length || 1);
  const sd = a => { if (a.length < 2) return NaN; const m = mean(a); return Math.sqrt(a.reduce((s, x) => s + (x - m) ** 2, 0) / (a.length - 1)); };
  const mad = (a, med) => median(a.map(x => Math.abs(x - med)));

  /* ---------- Séries ---------- */
  const cache = new Map();
  function rawRows(m, crew) {
    if (m.cat === 'lab') return DB.labs.filter(r => r.code === m.code && r.crew === crew).map(r => ({ date: r.date, v: r.value, user: !!r.user }));
    if (m.cat === 'env') return DB.env.map(r => ({ date: r.date, v: r[m.col], user: !!r.user }));
    const tbl = m.cat === 'vitals' ? DB.vitals : m.cat === 'mental' ? DB.mental : DB.rad;
    const f = m.col || m.field;
    return tbl.filter(r => r.crew === crew && r[f] != null && r[f] !== '').map(r => ({ date: r.date, v: +r[f], user: !!r.user, phase: r.phase }));
  }
  function series(m, crew) {
    const k = m.key + '|' + (m.cat === 'env' ? 0 : crew) + '|' + DB.version;
    if (cache.has(k)) return cache.get(k);
    const pts = rawRows(m, crew).map(r => ({ ...r, t: ts(r.date), d: dayKey(r.date) })).filter(p => !isNaN(p.v)).sort((a, b) => a.t - b.t);
    cache.set(k, pts); return pts;
  }
  function daily(m, crew) {
    const by = new Map();
    series(m, crew).forEach(p => { (by.get(p.d) || by.set(p.d, []).get(p.d)).push(p.v); });
    return [...by.entries()].map(([d, v]) => ({ d, t: ts(d), v: mean(v) })).sort((a, b) => a.t - b.t);
  }

  /* ---------- Baseline ---------- */
  const BASE_DAYS = 10, MIN_N = 5;
  function windowVals(m, crew) {
    const pts = series(m, crew); if (!pts.length) return [];
    const first = pts[0].t;
    return pts.filter(p => (p.t - first) / DAY < BASE_DAYS).map(p => p.v);

  function stats(vals, m, source) {
    const med = median(vals), s = sd(vals), md = mad(vals, med) * 1.4826;

  function baseline(m, crew) {

  }

  /* ---------- Avaliação ---------- */

    out.side = out.refSide || (out.sz != null && out.sz >= 2 ? out.dir : 0) || out.dir;
    return out;
  }

  function latest(m, crew) { const s = series(m, crew); return s.length ? s[s.length - 1] : null; }

      if (P.length < 3) { el.innerHTML = '<div class="empty"><b>Poucos pontos</b>Amplie o período ou inclua mais tripulantes.</div>'; return; }
      const ext = k => { let a = Math.min(...P.map(p => p[k])), b = Math.max(...P.map(p => p[k])); const pd = (b - a) * .06 || 1; return [a - pd, b + pd]; };
      let [x0, x1] = ext('x'), [y0, y1] = ext('y'); const xt = niceTicks(x0, x1, 5), yt = niceTicks(y0, y1, 4); x0 = Math.min(x0, xt[0]); x1 = Math.max(x1, xt[xt.length - 1]); y0 = Math.min(y0, yt[0]); y1 = Math.max(y1, yt[yt.length - 1]);

        tipShow(e.clientX, e.clientY, `${b.name} · ${fmtDY(b.d)}`, [{ name: o.xl, val: fmt(b.x, o.xdec) }, { name: o.yl, val: fmt(b.y, o.ydec) }]);

      let s = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="${esc(o.aria || '')}"><g class="ax">`;
      yt.forEach(v => { s += `<line x1="${mg.l}" x2="${W - mg.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--grid)"/><text x="${mg.l - 8}" y="${Y(v) + 4}" text-anchor="end">${fmt(v, dec)}</text>`; });
      if (o.ref) { const a = Math.max(lo, o.ref.lo), b = Math.min(hi, o.ref.hi); if (b > a) s += `<rect x="${mg.l}" y="${Y(b)}" width="${iw}" height="${Y(a) - Y(b)}" fill="var(--good-bg)"/>`; }
      o.groups.forEach((g, i) => { const cx = mg.l + bw * i + bw / 2; s += `<text x="${cx}" y="${H - 22}" text-anchor="middle" style="fill:var(--ink-2)">${esc(g.label)}</text><text x="${cx}" y="${H - 7}" text-anchor="middle">${g.n} medições</text>`; });
      s += '</g>';

        g.pts.forEach((p, j) => { const off = (j - (g.pts.length - 1) / 2) * Math.min(22, bw * .5 / Math.max(1, g.pts.length)); s += `<circle class="pt" data-g="${i}" data-j="${j}" cx="${cx + off}" cy="${Y(p.v)}" r="5.5" style="fill:${p.color}" stroke="var(--panel)" stroke-width="2"/>`; });
      });
      el.innerHTML = s + `<line x1="${mg.l}" x2="${W - mg.r}" y1="${mg.t + ih}" y2="${mg.t + ih}" stroke="var(--axis)"/></svg>`;
      el.querySelectorAll('.pt').forEach(c => { const p = o.groups[+c.dataset.g].pts[+c.dataset.j]; c.addEventListener('pointermove', e => { c.setAttribute('r', 7.5); tipShow(e.clientX, e.clientY, p.name, [{ name: 'Média na fase', val: fmt(p.v, o.dec) + ' ' + o.unit }], p.n + ' medições'); }); c.addEventListener('pointerleave', () => { c.setAttribute('r', 5.5); tipHide(); }); });

  /* ---------- Faixa de baseline (assinatura) ---------- */
  function laneHTML(a) {

    if (m.ok) s += `<div class="refb" style="left:${P(m.ok[0])}%;width:${Math.max(.6, P(m.ok[1]) - P(m.ok[0]))}%"></div>`;
    if (b) s += `<div class="baseb" style="left:${P(b.lo)}%;width:${Math.max(.8, P(b.hi) - P(b.lo))}%"></div><div class="basem" style="left:${P(b.med)}%"></div>`;
    s += `<div class="mk l${a.level}" style="left:${P(v)}%" title="${esc(fmt(v, m.dec) + ' ' + m.unit)}"></div></div>`;

  function ring(level, frac, cls) {

})();

/* =========================================================
   Athenance: sistema de módulos referenciáveis
   ---------------------------------------------------------
   Cada caixa da interface é um módulo com ID estável, ex.: TRI-05.
     Prefixo = tela  (APP shell, REG registrar, TRI tripulante,
                      ANA análise, HIS registros, MET método)
     Número  = fixo, definido aqui; não muda se a caixa mudar de lugar.

   Para trocar o conteúdo de uma caixa: edite só o render do módulo.
   Para mudar a posição ou o tamanho: edite só o LAYOUT da tela.
   O mapa completo fica em web/MODULOS.md e no "modo referência".
   ========================================================= */
(function () {
  const U = window.UI, { esc } = U;
  const T = (s, v) => (window.I18N ? window.I18N.t(s, v) : s);
  const REG = {};
  const PAGE_PREFIX = { registrar: 'REG', tripulante: 'TRI', radiacao: 'RAD', analise: 'ANA', registros: 'HIS', metodo: 'MET' };

  /* def: { id, key, title, sub?, size: 's'|'m'|'l'|'xl'|'full', bare?, flush?, render(body, ctx, el) }
     bare = sem moldura; flush = corpo sem espaçamento interno; rows = linhas ocupadas
     size em colunas de 12: s=3, m=4, l=6, xl=8, full=12                     */
  function define(def) {
    if (REG[def.id]) console.warn('Módulo redefinido:', def.id);
    REG[def.id] = def;
  }

  const num = id => id.split('-')[1];

  function frame(def) {
    const el = document.createElement('section');
    el.className = 'mod' + (def.bare ? ' bare' : '') + (def.flush ? ' flush' : '');
    el.dataset.mod = def.id;
    el.dataset.size = def.size || 'full';
    if (def.rows) el.dataset.rows = def.rows;  // ocupa N linhas da grade (ex.: figura do corpo)
    el.setAttribute('aria-label', T(def.title));
    el.innerHTML = def.bare ? `<div class="mod-b"></div>` :
      `<header class="mod-h"><span class="mod-n" aria-hidden="true">${num(def.id)}</span><div class="mod-t"><h2>${esc(T(def.title))}</h2>${def.sub ? `<p>${esc(T(def.sub))}</p>` : ''}</div><div class="mod-x"></div></header><div class="mod-b"></div>`;
    return el;
  }

  /* layout: lista de IDs na ordem de leitura. A grade de 12 colunas quebra sozinha. */
  function mount(root, layout, ctx) {
    const grid = document.createElement('div');
    grid.className = 'mods view-in';
    layout.forEach(id => {
      const def = REG[id];
      if (!def) { console.error('Módulo não encontrado:', id); return; }
      const el = frame(def);
      grid.appendChild(el);
      try { def.render(el.querySelector('.mod-b'), ctx, el); }
      catch (e) { console.error(id, e); el.querySelector('.mod-b').innerHTML = `<div class="empty"><b>${T('Erro no módulo {id}', { id: esc(id) })}</b>${esc(e.message)}</div>`; }
    });
    root.innerHTML = '';
    root.appendChild(grid);
    tagAll();
    return grid;
  }

  /* Telas ainda não migradas: recebem IDs provisórios pela ordem dos cartões. */
  function tagLegacy(root, page) {
    const pre = PAGE_PREFIX[page];
    if (!pre || root.querySelector('.mods')) return;
    let n = 0;
    root.querySelectorAll('.card').forEach(c => {
      if (c.parentElement.closest('.card')) return;
      n++;
      c.dataset.mod = `${pre}-${String(n).padStart(2, '0')}`;
      c.dataset.legacy = '1';
    });
    tagAll();
  }

  /* Etiqueta visível no modo referência (clique copia a referência). */
  /* Nomes de caixas provisórias sem título próprio */
  const LEGACY_NAMES = { 'REG-01': 'Formulário de registro', 'REG-02': 'Diagnóstico ao vivo', 'ANA-01': 'Filtros', 'HIS-01': 'Tabela de registros' };
  function title(el) {
    const id = el.dataset.mod, def = REG[id];
    if (def) return T(def.title);
    if (el.dataset.legacy && LEGACY_NAMES[id]) return T(LEGACY_NAMES[id]);
    if (el.dataset.title) return el.dataset.title;
    const h = [...el.querySelectorAll('h1,h2,h3,h4,label,b,strong,small')].find(x => !x.closest('.ref-tag'));
    return h ? h.textContent.trim().replace(/\s+/g, ' ').slice(0, 40) : '';
  }
  function tagAll() {
    document.querySelectorAll('[data-mod]').forEach(el => {
      let t = el.querySelector(':scope > .ref-tag');
      if (!t) { t = document.createElement('button'); t.type = 'button'; t.className = 'ref-tag'; el.prepend(t); t.onclick = e => { e.stopPropagation(); copyRef(el); }; }
      const id = el.dataset.mod, tl = title(el);
      t.innerHTML = `<b>${esc(id)}</b>${tl ? `<span>${esc(tl)}</span>` : ''}${el.dataset.legacy ? `<em>${T('provisório')}</em>` : ''}`;
      t.title = T('Copiar referência');
    });
  }
  function copyRef(el) {
    const page = (location.hash || '#tripulante').slice(1);
    const txt = `${el.dataset.mod} (${title(el)}, ${T('tela')} ${page})`;
    const done = () => window.APP && window.APP.toast(T('Copiado: ') + txt);
    try { navigator.clipboard.writeText(txt).then(done, done); } catch (e) { done(); }
  }

  /* Modo referência: ferramenta de desenvolvimento. Só existe quando o endereço tem ?ref
     (ex.: http://127.0.0.1:8765/?ref#tripulante). Sem isso, não há botão nem atalho. */
  const DEV = /[?&]ref(?:[=&]|$)/.test(location.search);
  const LS = 'athenance.refmode';
  const isRef = () => document.documentElement.classList.contains('ref-mode');
  function setRef(on) {
    document.documentElement.classList.toggle('ref-mode', on);
    try { localStorage.setItem(LS, on ? '1' : '0'); } catch (e) {}
    document.querySelectorAll('[data-refbtn]').forEach(b => b.setAttribute('aria-pressed', on));
  }
  function initRef() {
    if (!DEV) return;
    let on = false; try { on = localStorage.getItem(LS) === '1'; } catch (e) {}
    setRef(on);
    document.addEventListener('keydown', e => {
      if (e.altKey && (e.key === 'r' || e.key === 'R') && !e.ctrlKey && !e.metaKey) { e.preventDefault(); setRef(!isRef()); }
    });
  }

  const list = () => Object.values(REG).map(d => ({ id: d.id, key: d.key, title: d.title, size: d.size }));

  window.MOD = { define, mount, tagLegacy, tagAll, setRef, isRef, initRef, DEV, list, REG, PAGE_PREFIX };
})();

/* =========================================================
   Athenance: widgets visuais reutilizáveis
   gauge  = velocímetro (meia-lua) com zonas em degradê
   hbar   = barra horizontal com zonas em degradê
   spark  = minigráfico dos últimos dias
   As cores das zonas vêm das faixas da métrica no motor (m.ok / m.warn),
   então o visual e o diagnóstico usam sempre os mesmos limites.
   ========================================================= */
(function () {
  const U = window.UI, { esc, fmt } = U;

  /* ---------- Cores (lidas do tema atual) ---------- */
  const hex = h => { h = h.trim().replace('#', ''); if (h.length === 3) h = h.split('').map(c => c + c).join(''); return [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16)); };
  const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n);
  const mix = (a, b, t) => a.map((x, i) => Math.round(x + (b[i] - x) * t));
  const rgb = c => `rgb(${c[0]},${c[1]},${c[2]})`;
  function palette() { return { good: hex(cssVar('--good')), warn: hex(cssVar('--warn')), crit: hex(cssVar('--crit')) }; }

  /* Severidade contínua: 0 dentro da faixa ok, 1 na borda da faixa de atenção, >1 além dela. */
  function severity(m, v) {
    const [lo, hi] = m.ok, [wlo, whi] = m.warn;
    if (v < lo) return lo === wlo ? 2 : (lo - v) / (lo - wlo);
    if (v > hi) return hi === whi ? 2 : (v - hi) / (whi - hi);
    return 0;
  }
  /* Degradê: verde -> âmbar logo após o limite ok; âmbar -> vermelho ao passar do limite de atenção. */
  function colorFor(m, v, P) {
    P = P || palette();
    const s = severity(m, v);
    if (s <= 0) return rgb(P.good);
    if (s < 1) return rgb(mix(P.good, P.warn, Math.min(1, s / 0.45)));
    return rgb(mix(P.warn, P.crit, Math.min(1, (s - 1) / 0.2)));
  }
  const clamp = (x, a, b) => Math.max(a, Math.min(b, x));

  /* ---------- Velocímetro ----------
     o: { m, v, min, max, base?, ticks?: [valor], marks?: [{v,label}], band?: {from,to,label}, label? } */
  function gauge(o) {
    const P = palette(), W = 220, H = 128, cx = 110, cy = 112, r = 84, sw = 13;
    const t = v => clamp((v - o.min) / (o.max - o.min), 0, 1);
    const ang = v => Math.PI * (1 - t(v));
    const pt = (rr, a) => [cx + rr * Math.cos(a), cy - rr * Math.sin(a)];
    const arc = (rr, v1, v2) => { const a = pt(rr, ang(v1)), b = pt(rr, ang(v2)); return `M${a[0].toFixed(2)} ${a[1].toFixed(2)}A${rr} ${rr} 0 0 1 ${b[0].toFixed(2)} ${b[1].toFixed(2)}`; };
    const N = 72, step = (o.max - o.min) / N;
    let segs = '';
    for (let i = 0; i < N; i++) {
      const v1 = o.min + i * step, v2 = Math.min(o.max, v1 + step * 1.04);
      segs += `<path d="${arc(r, v1, v2)}" stroke="${colorFor(o.m, v1 + step / 2, P)}"/>`;
    }
    let band = '';
    if (o.band) {
      band = `<path class="g-band" d="${arc(r + sw / 2 + 5, o.band.from, o.band.to)}"><title>${esc(o.band.label || '')}</title></path>`;
    }
    const ticks = (o.ticks || []).map(v => {
      const a = ang(v), p1 = pt(r - sw / 2 - 2, a), p2 = pt(r - sw / 2 - 7, a), lp = pt(r - sw / 2 - 15, a);
      const anchor = Math.cos(a) > 0.35 ? 'end' : Math.cos(a) < -0.35 ? 'start' : 'middle';
      return `<line class="g-tick" x1="${p1[0].toFixed(1)}" y1="${p1[1].toFixed(1)}" x2="${p2[0].toFixed(1)}" y2="${p2[1].toFixed(1)}"/><text class="g-tl" x="${lp[0].toFixed(1)}" y="${(lp[1] + 3).toFixed(1)}" text-anchor="${anchor}">${fmt(v, 0)}</text>`;
    }).join('');
    const marks = (o.marks || []).map(mk => { const a = ang(mk.v), p1 = pt(r - sw / 2, a), p2 = pt(r + sw / 2, a); return `<line class="g-mark" x1="${p1[0].toFixed(1)}" y1="${p1[1].toFixed(1)}" x2="${p2[0].toFixed(1)}" y2="${p2[1].toFixed(1)}"><title>${esc(mk.label)}</title></line>`; }).join('');
    let base = '';
    if (o.base != null) { const a = ang(o.base), p = pt(r + sw / 2 + 2, a), q1 = pt(r + sw / 2 + 9, a - 0.05), q2 = pt(r + sw / 2 + 9, a + 0.05); base = `<path class="g-base" d="M${p[0].toFixed(1)} ${p[1].toFixed(1)}L${q1[0].toFixed(1)} ${q1[1].toFixed(1)}L${q2[0].toFixed(1)} ${q2[1].toFixed(1)}Z"><title>Seu padrão</title></path>`; }
    let needle = '';
    if (o.v != null && !isNaN(o.v)) {
      const a = ang(o.v), tip = pt(r - sw / 2 - 3, a), b1 = pt(5, a + Math.PI / 2), b2 = pt(5, a - Math.PI / 2), tail = pt(10, a + Math.PI);
      needle = `<g class="g-needle"><path d="M${tip[0].toFixed(1)} ${tip[1].toFixed(1)}L${b1[0].toFixed(1)} ${b1[1].toFixed(1)}L${tail[0].toFixed(1)} ${tail[1].toFixed(1)}L${b2[0].toFixed(1)} ${b2[1].toFixed(1)}Z"/><circle cx="${cx}" cy="${cy}" r="6"/><circle class="g-hub" cx="${cx}" cy="${cy}" r="2.4"/></g>`;
    }
    const ends = `<text class="g-tl g-end" x="${cx - r}" y="${cy + 14}" text-anchor="middle">${fmt(o.min, 0)}</text><text class="g-tl g-end" x="${cx + r}" y="${cy + 14}" text-anchor="middle">${fmt(o.max, 0)}${o.v > o.max ? '+' : ''}</text>`;
    return `<svg class="gauge" viewBox="0 -14 ${W} ${H + 18}" role="img" aria-label="${esc(o.label || o.m.label)}: ${fmt(o.v, o.m.dec)} ${esc(o.m.unit)}"><g class="g-arc" fill="none" stroke-width="${sw}">${segs}</g>${band}${marks}${ticks}${base}${needle}${ends}</svg>`;
  }

  /* ---------- Barra horizontal ----------
     o: { m, v, min, max, base?, ticks?: [valor], zones?: [{from,to,label}] } */
  function hbar(o) {
    const P = palette(), pos = v => clamp((v - o.min) / (o.max - o.min), 0, 1) * 100;
    const stops = []; for (let i = 0; i <= 40; i++) { const v = o.min + (o.max - o.min) * i / 40; stops.push(`${colorFor(o.m, v, P)} ${(i * 2.5).toFixed(1)}%`); }
    const ticks = (o.ticks || []).map(v => `<span style="left:${pos(v).toFixed(1)}%">${fmt(v, o.tickDec || 0)}</span>`).join('');
    const base = o.base != null ? `<i class="hb-base" style="left:${pos(o.base).toFixed(1)}%" title="Seu padrão"></i>` : '';
    const mk = o.v != null ? `<i class="hb-mk" style="left:${pos(o.v).toFixed(1)}%"></i>` : '';
    const zones = (o.zones || []).map(z => `<span style="left:${((pos(z.from) + pos(z.to)) / 2).toFixed(1)}%">${esc(z.label)}</span>`).join('');
    return `<div class="hbar${zones ? ' has-z' : ''}" role="img" aria-label="${esc(o.m.label)}: ${fmt(o.v, o.m.dec)} ${esc(o.m.unit)}">${zones ? `<div class="hb-zones">${zones}</div>` : ''}<div class="hb-track" style="background:linear-gradient(90deg,${stops.join(',')})"></div>${base}${mk}<div class="hb-ticks"><span style="left:0">${fmt(o.min, o.tickDec || 0)}</span>${ticks}<span style="left:100%">${fmt(o.max, o.tickDec || 0)}</span></div></div>`;
  }

  /* ---------- Minigráfico ----------
     pts: [{t, v}] em ordem; o: { band?: [lo, hi], base?, color? } */
  function spark(pts, o = {}) {
    if (!pts.length) return '<div class="spark empty small muted">Sem dados</div>';
    const W = 200, H = 44, pad = 4;
    const vals = pts.map(p => p.v).concat(o.band ? o.band : []).concat(o.base != null ? [o.base] : []);
    let lo = Math.min(...vals), hi = Math.max(...vals); if (hi - lo < 1e-9) { lo -= 1; hi += 1; }
    const span = hi - lo; lo -= span * 0.12; hi += span * 0.12;
    const x = i => pts.length === 1 ? W / 2 : pad + (W - 2 * pad) * i / (pts.length - 1);
    const y = v => H - pad - (H - 2 * pad) * (v - lo) / (hi - lo);
    const line = pts.map((p, i) => `${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join(' ');
    const band = o.band ? `<rect class="sp-band" x="0" width="${W}" y="${y(o.band[1]).toFixed(1)}" height="${Math.max(0, y(o.band[0]) - y(o.band[1])).toFixed(1)}"/>` : '';
    const base = o.base != null ? `<line class="sp-base" x1="0" x2="${W}" y1="${y(o.base).toFixed(1)}" y2="${y(o.base).toFixed(1)}"/>` : '';
    const last = pts[pts.length - 1];
    return `<div class="spark"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">${band}${base}<polyline points="${line}"/></svg><i style="left:${(x(pts.length - 1) / W * 100).toFixed(1)}%;top:${(y(last.v) / H * 100).toFixed(1)}%"></i></div>`;
  }

  Object.assign(window.UI, { gauge, hbar, spark, colorFor, severity });
})();

/* =========================================================
   Athenance: cenários de demonstração de um clique
   ---------------------------------------------------------
   Um cenário reescreve, SÓ EM MEMÓRIA, os últimos dias de UM tripulante
   (o selecionado). Nada vai para localStorage nem para os CSVs.
   "Voltar aos dados da base" recarrega a base sintética + registros do usuário.
   Valores são relativos ao padrão pessoal (baseline) do tripulante.
   ========================================================= */
(function () {
  const A = window.AT;
  const DAY = 864e5;
  const S = { active: null, crew: null };

  /* RNG determinístico: o mesmo cenário gera sempre os mesmos números */
  function rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const gauss = r => { let u = 0, v = 0; while (!u) u = r(); while (!v) v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
  const round = (x, d) => Math.round(x * 10 ** d) / 10 ** d;
  const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
  const dayStr = t => new Date(t).toISOString().slice(0, 10);

  /* Contexto comum entregue a cada cenário */
  function context(crew, days, seed) {
    const last = A.crewLastDate(crew).slice(0, 10), lastT = A.ts(last);
    const start = dayStr(lastT - (days - 1) * DAY);
    const r = rng(seed * 7919 + crew);
    const B = {}; A.MET.forEach(m => { const b = A.baseline(m, crew); if (b) B[m.key] = b; });
    const med = k => B[k] ? B[k].med : null, sig = k => B[k] ? B[k].sigma : 0;
    const inWin = row => row.crew === crew && row.date.slice(0, 10) >= start;
    const frac = row => days <= 1 ? 1 : (A.ts(row.date.slice(0, 10)) - A.ts(start)) / DAY / (days - 1); // 0 no 1º dia, 1 no último
    const n = (s = 1) => gauss(r) * s;
    return { crew, last, start, r, B, med, sig, inWin, frac, n };
  }

  /* Recalcula a dose acumulada do tripulante a partir das taxas (integração de 24 h) */
  function recomputeCum(crew) {
    const rows = A.DB.rad.filter(x => x.crew === crew).sort((a, b) => a.date < b.date ? -1 : 1);
    let cum = 0; rows.forEach(x => { cum += x.rate * 24 / 1000; x.cum = round(cum, 4); });
  }
  function addLab(c, code, value) {
    A.DB.labs.push({ crew: c.crew, date: c.last + 'T07:00', code, value: round(value, 3), qual: 'Quantified', scenario: true });
  }
  function setStages(c, row, deep, rem) {
    const s = A.DB.sleep.find(x => x.crew === c.crew && x.date === row.date); if (!s) return;
    s.tst = Math.round(row.sleep * 60); s.deep = round(clamp(deep, 6, 30), 1); s.rem = round(clamp(rem, 10, 32), 1); s.light = round(100 - s.deep - s.rem, 1);
  }

  const SCENARIOS = {
    nominal: {
      name: 'Nominal', icon: 'check', days: 14, seed: 1,
      desc: 'Duas semanas de rotina estável, todos os indicadores perto do padrão pessoal.',
      expect: ['Condição geral: Estável', 'Mapa do corpo todo verde', 'Nenhum padrão combinado'],
      apply(c) {
        A.DB.vitals.filter(c.inWin).forEach(x => {
          ['hr', 'sbp', 'dbp', 'temp', 'spo2', 'glu'].forEach(k => { if (c.med(k) != null) x[k] = round(c.med(k) + c.n(0.35 * c.sig(k)), A.MBY[k].dec + 1); });
          x.spo2 = clamp(x.spo2, 0, 100); if (c.med('mass') != null) x.mass = round(c.med('mass') + c.n(0.12), 2);
        });
        A.DB.mental.filter(c.inWin).forEach(x => {
          ['sleep', 'eff', 'mood', 'rt'].forEach(k => { if (c.med(k) != null) x[k] = round(c.med(k) + c.n(0.35 * c.sig(k)), 2); });
          x.stress = round(clamp(c.med('stress') + c.n(0.2), 1, 2.4), 1); x.mood = round(clamp(x.mood, 3.6, 5), 1); x.eff = round(clamp(x.eff, 85, 99), 1);
          setStages(c, x, 19 + c.n(1.2), 22.5 + c.n(1.2));
        });
        ['WBC', 'HS_CRP', 'CORTISOL_AM', 'VITAMIN_D_25OH', 'CTX', 'EBV_DNA_SALIVA', 'MICROBIOME_SHANNON', 'CAROTID_IMT'].forEach(code => {
          const k = A.LABCODE[code], m = A.MBY[k]; if (c.med(k) == null) return;
          let v = c.med(k) + c.n(0.2 * c.sig(k));
          if (m.ok) v = clamp(v, m.ok[0] + 0.1 * (m.ok[1] - m.ok[0]), m.ok[1] - 0.1 * (m.ok[1] - m.ok[0]));  // rotina: dentro da faixa de referência
          addLab(c, code, v);
        });
        A.DB.rad.filter(c.inWin).forEach(x => { x.rate = round(c.med('rad_rate') + c.n(0.3 * c.sig('rad_rate')), 3); });
        recomputeCum(c.crew);
        A.DB.env.filter(x => x.date.slice(0, 10) >= c.start).forEach(x => { x.co2 = round(c.med('co2') + c.n(40), 1); x.rh = round(c.med('rh') + c.n(1.5), 1); });
      },
    },

    sono: {
      name: 'Dívida de sono', icon: 'moon', days: 6, seed: 2,
      desc: 'Rotina estável e depois seis noites curtas e fragmentadas por carga de trabalho, cerca de 5 h por noite.',
      expect: ['Sono e eficiência fora da faixa', 'Padrão "Fadiga e estresse combinados"', 'Menos sono profundo e REM no TRI-20', 'FC de repouso um pouco acima do padrão'],
      apply(c) {
        A.DB.mental.filter(c.inWin).forEach(x => {
          const f = clamp(0.35 + c.frac(x), 0, 1);
          x.sleep = round(c.med('sleep') - f * (c.med('sleep') - 5.0) + c.n(0.2), 2);
          x.eff = round(c.med('eff') - f * (c.med('eff') - 77) + c.n(1.2), 1);
          x.stress = round(clamp(c.med('stress') + f * (3.3 - c.med('stress')) + c.n(0.15), 1, 5), 1);
          x.mood = round(clamp(c.med('mood') - f * (c.med('mood') - 2.9) + c.n(0.15), 1, 5), 1);
          x.rt = round(c.med('rt') * (1 + 0.16 * f) + c.n(4), 1);
          setStages(c, x, 19 - 8 * f + c.n(1), 22 - 7 * f + c.n(1));
        });
        A.DB.vitals.filter(c.inWin).forEach(x => { const f = clamp(0.35 + c.frac(x), 0, 1); x.hr = round(c.med('hr') + 6 * f + c.n(1), 1); x.sbp = round(c.med('sbp') + 5 * f + c.n(1.5), 1); x.glu = round(c.med('glu') + 6 * f + c.n(2), 1); });
      },
    },

    radiacao: {
      name: 'Evento de radiação', icon: 'rad', days: 3, seed: 3,
      desc: 'Rotina estável e depois um evento de partículas solares (prótons de alta energia), com a tripulação no abrigo da nave.',
      expect: ['Taxa de dose muito acima do padrão no TRI-08', 'Padrão "Pico de radiação"', 'Sinais vitais sem mudança: doses dessa ordem não dão sintomas agudos; o risco é de longo prazo'],
      apply(c) {
        const prof = [120, 55, 14];  // µSv/h médio em cada dia: início, pico decaindo, cauda (ilustrativo, dentro do abrigo)
        A.DB.rad.filter(c.inWin).sort((a, b) => a.date < b.date ? -1 : 1).forEach((x, i) => { x.rate = round(prof[Math.min(i, prof.length - 1)] * (1 + c.n(0.06)), 3); });
        recomputeCum(c.crew);
      },
    },

    viral: {
      name: 'Síndrome gripal', icon: 'warn', days: 4, seed: 4,
      desc: 'Rotina estável e depois quatro dias de quadro compatível com influenza A: febre, FC alta, cansaço e PCR elevada.',
      expect: ['Temperatura crítica (febre acima de 38 °C)', 'Padrão "Possível resposta infecciosa"', 'Sistema imunológico em alerta no mapa do corpo', 'SpO₂ cai cerca de 2 pontos: ainda na faixa ideal, mas abaixo do seu padrão'],
      apply(c) {
        const ramp = [0.35, 0.85, 1, 1];  // intensidade por dia: início, piora, pico, pico
        const f = x => ramp[clamp(Math.round(c.frac(x) * (ramp.length - 1)), 0, ramp.length - 1)];
        A.DB.vitals.filter(c.inWin).forEach(x => {
          const k = f(x);
          x.temp = round(c.med('temp') + 1.9 * k + c.n(0.08), 2); x.hr = round(c.med('hr') + 18 * k + c.n(1.5), 1);
          x.spo2 = round(clamp(c.med('spo2') - 2.4 * k + c.n(0.3), 0, 100), 1); x.glu = round(c.med('glu') + 8 * k + c.n(2), 1);
        });
        A.DB.mental.filter(c.inWin).forEach(x => {
          const k = f(x);
          x.eff = round(c.med('eff') - 9 * k + c.n(1), 1); x.mood = round(clamp(c.med('mood') - 1.3 * k + c.n(0.1), 1, 5), 1);
          x.stress = round(clamp(c.med('stress') + 0.9 * k + c.n(0.1), 1, 5), 1); x.rt = round(c.med('rt') * (1 + 0.12 * k), 1);
          setStages(c, x, 19 - 5 * k + c.n(1), 22 - 5 * k + c.n(1));
        });
        addLab(c, 'HS_CRP', 18 + c.n(2));                              // inflamação aguda
        addLab(c, 'WBC', Math.max(3.8, c.med('wbc') * 0.85));          // influenza: leucócitos normais ou um pouco baixos
      },
    },
  };

  function apply(id, crew) {
    reset(true);
    const sc = SCENARIOS[id]; if (!sc) return;
    /* Eventos partem de uma rotina nominal: o sinal do cenário aparece limpo, sem as tendências da base */
    const nom = SCENARIOS.nominal, cn = context(crew, nom.days, nom.seed);
    nom.apply(cn);
    const c = id === 'nominal' ? cn : context(crew, sc.days, sc.seed);
    if (id !== 'nominal') sc.apply(c);
    S.start = cn.start;
    A.DB.version++;
    S.active = id; S.crew = crew; S.last = c.last; S.eventStart = c.start;
  }
  function reset(silent) {
    A.loadSeed(); A.loadUser(); A.DB.version++;
    if (!silent) { S.active = null; S.crew = null; }
  }

  function crewName(id) { const x = A.DB.crew.find(c => c.id === id); return x ? x.name : ''; }

  /* Aviso global (APP-03) */
  function renderBanner() {
    const el = document.getElementById('scnb'); if (!el) return;
    if (!S.active) { el.hidden = true; el.innerHTML = ''; return; }
    const sc = SCENARIOS[S.active], U = window.UI, T = (s, v) => window.I18N.t(s, v);
    el.hidden = false;
    el.innerHTML = `<span class="scn-dot"></span><div><b>${T('Cenário simulado ativo: {s}', { s: U.esc(T(sc.name)) })}</b><span>${T('Aplicado a {n}: rotina nominal de {a} a {b}', { n: U.esc(crewName(S.crew)), a: U.fmtD(S.start), b: U.fmtD(S.last) })}${S.active !== 'nominal' ? T(', evento a partir de {d}', { d: U.fmtD(S.eventStart) }) : ''}. ${T('Só em memória: não altera a base nem os registros salvos.')}</span></div><button class="btn sm" type="button" data-scn-reset>${U.icon('undo')}${T('Voltar aos dados da base')}</button>`;
    el.querySelector('[data-scn-reset]').onclick = () => { reset(); window.APP.refreshHeader(); window.APP.render(); window.APP.toast(T('Dados da base restaurados')); };
    window.MOD.tagAll();
  }

  window.SCN = { SCENARIOS, apply, reset, state: S, renderBanner, crewName };
})();

/* =========================================================
   Registrar dados + diagnóstico imediato
   ========================================================= */
(function () {
  const A = window.AT, U = window.UI, { esc, fmt, icon, chip } = U;
  const V = (window.VIEWS = window.VIEWS || {});

  const TABS = ['vitals', 'mental', 'lab', 'rad', 'env'];
  const F = { crew: null, date: '', phase: '', tab: 'vitals', vals: {}, ebvBelow: false, dos: '', cabin: 'HAB-01', cumTouched: false, result: null, phaseTouched: false };

  const fieldMets = cat => A.MET.filter(m => m.cat === cat);
  const parse = s => { if (s == null || s === '') return null; const n = parseFloat(String(s).replace(',', '.')); return isNaN(n) ? NaN : n; };

  function resetForm(keepCrew) {
    const c = keepCrew || F.crew || A.DB.crew[0].id;
    F.crew = c; F.vals = {}; F.ebvBelow = false; F.cumTouched = false; F.result = null;
    F.date = A.nextSuggestedDate(c); F.phase = A.phaseForDate(F.date); F.phaseTouched = false;
    const last = A.lastCum(c); F.dos = last ? last.dos : 'DOS-0' + c; F.cabin = 'HAB-01';
  }

  function filled() { return A.MET.filter(m => F.vals[m.key] != null && F.vals[m.key] !== '' && !isNaN(parse(F.vals[m.key]))); }
  function errors() {
    const e = {}; A.MET.forEach(m => { const raw = F.vals[m.key]; if (raw == null || raw === '') return; const v = parse(raw); if (isNaN(v)) e[m.key] = 'Digite um número.'; else if (!A.plausible(m, v)) e[m.key] = `Fora do intervalo plausível (${fmt(m.plaus[0], m.dec)} a ${fmt(m.plaus[1], m.dec)} ${m.unit}).`; });
    if (F.vals.dbp != null && F.vals.sbp != null && parse(F.vals.dbp) >= parse(F.vals.sbp)) e.dbp = 'A diastólica deve ser menor que a sistólica.';
    return e;
  }
  function computeItems() {
    const err = errors();
    return filled().filter(m => !err[m.key]).map(m => A.assess(m, F.crew, parse(F.vals[m.key])));
  }
  function summarize(items) {
    const level = items.length ? Math.max(...items.map(i => i.level)) : null;
    const nOk = items.filter(i => i.level === 0).length;
    return { level, nOk, frac: items.length ? nOk / items.length : 0, n1: items.filter(i => i.level === 1).length, n2: items.filter(i => i.level === 2).length };
  }
  function hintFor(m) {
    const b = A.baseline(m, F.crew), p = [];
    if (b) p.push(`Seu padrão: <b>${fmt(b.med, m.dec)}</b> ± ${fmt(b.sigma, m.dec)}${b.source !== 'individual' ? ` (${b.source})` : ''}`);
    if (m.ok) p.push(`ref. ${fmt(m.ok[0], m.dec)}–${fmt(m.ok[1], m.dec)}`);
    return p.join(' · ') || 'Sem padrão ainda';
  }

  /* ---------- Render ---------- */
  function fieldHTML(m) {
    const v = F.vals[m.key] != null ? F.vals[m.key] : '';
    let extra = '';
    if (m.cat === 'mental' && (m.key === 'mood' || m.key === 'stress')) extra = `<div class="quick" data-quick="${m.key}">${[1, 2, 3, 4, 5].map(n => `<button type="button" data-v="${n}" class="${parse(v) === n ? 'on' : ''}" aria-label="${m.label} ${n}">${n}</button>`).join('')}</div>`;
    const ok = m.key === 'ebv' ? `<label class="check"><input type="checkbox" id="ebvBelow" ${F.ebvBelow ? 'checked' : ''}> Abaixo do limite de quantificação (100 cópias/mL)</label>` : '';
    return `<div class="field" data-f="${m.key}"><label for="f-${m.key}"><span>${esc(m.label)}</span></label>
      <div class="unit-wrap"><input class="inp" id="f-${m.key}" inputmode="decimal" autocomplete="off" data-k="${m.key}" value="${esc(v)}" placeholder="${m.ok ? fmt((m.ok[0] + m.ok[1]) / 2, m.dec) : ''}"${m.ok && m.key !== 'rad_cum' ? ` data-sug="${((m.ok[0] + m.ok[1]) / 2).toFixed(m.dec)}" title="Clique para preencher com o valor sugerido"` : ''}><em>${esc(m.unit)}</em></div>
      ${extra}${ok}<div class="hint" data-hint="${m.key}">${hintFor(m)}</div><div class="err" data-err="${m.key}"></div></div>`;
  }
  function tabBody() {
    const t = F.tab, ms = fieldMets(t);
    if (t === 'rad') {
      return `<div class="field"><label for="f-dos"><span>Dosímetro</span></label><input class="inp" id="f-dos" value="${esc(F.dos)}"><div class="hint">Identificador do dosímetro pessoal.</div></div><div></div>` +
        ms.map(m => m.key === 'rad_cum' ? fieldHTML(m).replace('<div class="hint"', `<div class="hint cumhint"></div><div class="hint" style="display:none"`) : fieldHTML(m)).join('');
    }
    if (t === 'env') return `<div class="field"><label for="f-cabin"><span>Cabine</span></label><input class="inp" id="f-cabin" value="${esc(F.cabin)}"><div class="hint">Os dados de ambiente valem para toda a tripulação.</div></div><div></div>` + ms.map(fieldHTML).join('');
    if (t === 'lab') return `<div class="field span2"><div class="callout">${icon('info')}<div>Exames são coletados a cada ~14 dias. Preencha apenas o que foi medido hoje e deixe o resto em branco.</div></div></div>` + ms.map(fieldHTML).join('');
    return ms.map(fieldHTML).join('');
  }

  function render(root) {
    if (F.crew == null) resetForm();
    if (F.result) return renderResult(root);
    Object.keys(F.vals).length || SUG.clear();  // formulário zerado (novo, limpar, troca de tripulante): sugestões valem de novo

    </div>

  function bind(root) {

    root.querySelector('#f-date').onchange = e => { F.date = e.target.value; if (!F.phaseTouched && F.date) { F.phase = A.phaseForDate(F.date); root.querySelector('#f-phase').value = F.phase; } refresh(root); };
    root.querySelector('#f-phase').onchange = e => { F.phase = e.target.value; F.phaseTouched = true; };

    root.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { F.tab = b.dataset.tab; root.querySelectorAll('[data-tab]').forEach(x => x.setAttribute('aria-selected', x === b)); root.querySelector('#fields').innerHTML = tabBody(); bindFields(root); refresh(root); });
    root.querySelector('#clear').onclick = () => { const c = F.crew; F.vals = {}; F.ebvBelow = false; F.cumTouched = false; render(root); };

  /* Clique em campo vazio preenche o valor sugerido (o mesmo do placeholder; na dose acumulada, última dose + taxa × tempo).
     Vale uma vez por campo: se a pessoa apagar, o campo fica vazio. O valor entra selecionado, então digitar substitui. */
  const SUG = new Set();
  function fillSuggested(root, inp) {

  function suggestCum() {

    live.innerHTML = head + (items.length ? `<div class="live-list">${items.map(rowHTML).join('')}</div>${U.LANE_KEY}` : `<div class="live-empty">Comparamos cada valor com a faixa de referência e com o seu padrão dos primeiros ${A.BASE_DAYS} dias de missão.</div>`);
    const msg = root.querySelector('#foot-msg'), n = filled().length; msg.textContent = n ? `${n} indicador${n > 1 ? 'es' : ''} preenchido${n > 1 ? 's' : ''}.` : 'Preencha os indicadores que você mediu. Nenhum campo é obrigatório.';

  }

  /* ---------- Salvar ---------- */
  function save(root) {
    const err = errors(); if (Object.keys(err).length || !filled().length) return;
    if (!F.date) { window.APP.toast('Informe a data e hora da medição.'); return; }
    const date = F.date.slice(0, 16), crew = F.crew, items = computeItems();
    const patt = A.patterns(A.szMapFromAssess(items));
    const recs = [], group = 'g' + Date.now().toString(36);
    const pick = keys => { const o = {}; let any = false; keys.forEach(([k, f]) => { const v = parse(F.vals[k]); o[f] = isNaN(v) ? null : v; if (v != null && !isNaN(v)) any = true; }); return any ? o : null; };
    const vit = pick([['hr', 'hr'], ['sbp', 'sbp'], ['dbp', 'dbp'], ['temp', 'temp'], ['spo2', 'spo2'], ['mass', 'mass'], ['glu', 'glu']]);

    A.MET.filter(m => m.cat === 'lab').forEach(m => { const v = parse(F.vals[m.key]); if (v != null && !isNaN(v)) recs.push({ type: 'labs', group, row: { crew, date, code: m.code, value: v, qual: m.key === 'ebv' && F.ebvBelow ? 'Below quantification threshold' : 'Quantified' } }); });
    const rad = pick([['rad_rate', 'rate'], ['rad_cum', 'cum']]); if (rad) recs.push({ type: 'rad', group, row: { crew, date, rate: rad.rate, cum: rad.cum, dos: F.dos || ('DOS-0' + crew) } });

  }

    const sub = sm.level === 0 ? 'Todas as medidas ficaram na faixa de referência e perto do seu padrão pessoal.' : sm.level === 1 ? 'Há desvios do seu padrão ou da faixa de referência. Veja as ações sugeridas abaixo e acompanhe nos próximos dias.' : 'Há valores fora da faixa segura. Siga as ações abaixo e contate o médico de voo.';
    const groups = {}; R.items.forEach(i => (groups[i.m.cat] = groups[i.m.cat] || []).push(i));
    root.innerHTML = `<div class="stack view-in">
      <div class="card"><div class="verdict">${U.ring(sm.level, Math.max(.08, sm.frac), 'big-ring')}<div><h2>${title}</h2><p>${sub}</p><p class="small muted" style="margin-top:8px">${esc(c.name)} · ${U.fmtDT(R.date)} · Dia ${A.missionDay(R.date)} · ${A.PHASE_PT[R.phase]} · ${R.n} indicadores avaliados</p></div>
        <div style="display:grid;gap:8px"><button class="btn primary" id="newRec">${icon('plus')}Novo registro</button><button class="btn" id="goCrew">Ver painel do tripulante</button><button class="btn ghost" id="goEx">Ver análise exploratória</button></div></div>
        <div class="lane-key" style="justify-content:space-between"><span>${R.stored ? 'Registro salvo neste navegador. Exporte em Registros para levar ao pipeline.' : 'Registro mantido apenas nesta sessão (o armazenamento do navegador não está disponível).'}</span><span>Triagem de software, não é diagnóstico clínico.</span></div></div>

      ${flagged.length ? `<div class="card"><div class="card-h"><div><h3>O que fazer agora</h3><p>Ordenado por prioridade.</p></div></div><div class="card-b" style="padding:8px 0 0"><div class="actions-list">${flagged.map(a => { const m = a.m, side = a.side > 0 ? 'high' : 'low', act = m.act[side] || m.act.high || m.act.low; return `<div class="act"><div class="bar l${a.level}"></div><div><h4>${esc(m.label)}: ${fmt(a.v, m.dec)} ${esc(m.unit)} ${chip(a.level)}</h4><p>${esc(act)}</p><p class="why">${esc(a.reasons.join(' · '))}. ${esc(m.why)}</p></div></div>`; }).join('')}</div></div></div>` : ''}
      <div class="card"><div class="card-h"><div><h3>Todos os indicadores deste registro</h3><p>Cada linha compara a medida com a faixa de referência e com o seu padrão.</p></div></div><div class="card-b" style="padding:10px 0 0">${Object.keys(groups).map(k => `<div style="padding:10px 18px 4px;font-weight:600;font-size:13px;display:flex;gap:8px;align-items:center;color:var(--ink-2)">${icon(U.CATICON[k])}${A.CATS[k].label}</div>${groups[k].map(a => rowHTML(a, true)).join('')}`).join('')}${U.LANE_KEY}</div></div></div>`;
    root.querySelector('#newRec').onclick = () => { const c = F.crew; resetForm(c); window.APP.render(); };

  V.registrar = { render, rowHTML, reset: () => resetForm(), form: F };

/* =========================================================
   Athenance: modelo de dose de radiação (página RAD)
   Toda constante tem a fonte ao lado. "real" = medido/publicado,
   "suposição" = escolha nossa para a demonstração.
   ========================================================= */
(function () {
  const RC = {
    LIMIT: 600,              // mSv, limite de carreira, dose efetiva. NASA-STD-3001 Vol.1 Rev B [V1 4030] (real)
    CAUTION: 0.8,            // 80% do limite = faixa de cautela (suposição, mesma regra do motor Python R9)
    SPE_LIMIT: 250,          // mSv, evento solar de projeto (soma dos eventos de out/1989). [V1 4031] (real)
    RATE_CRUISE: 1.84,       // mSv/dia, dose equivalente em cruzeiro Terra-Marte, MSL/RAD (Zeitlin et al. 2013) (real)
    RATE_SURFACE: 0.64,      // mSv/dia, dose equivalente na superfície de Marte, MSL/RAD (Hassler et al. 2014) (real; 0,67 em outra média)
    ABS_SURFACE: [0.18, 0.225], // mGy/dia, dose absorvida na superfície (Hassler et al. 2014) (real)
    GCR_SHIELD: 0.07,        // blindagem de alumínio/polietileno reduz só ~7% da dose de raios cósmicos. NASA OCHMO-TB-020 (real)
    SPE_SHIELD: 0.50,        // e ~50% da dose de eventos solares. NASA OCHMO-TB-020 (real)
    SPE_SURFACE_MULT: 2.5,   // set/2017: na superfície a taxa subiu 2 a 3 vezes o fundo por horas (Zeitlin/Hassler 2018) (real, valor médio)
    EVA_ABORT_MIN: 120,      // encerrar a EVA em até 2 h com alerta em tempo real dá proteção muito alta. NASA OCHMO-TB-020 (real)
    EARTH_BG_YEAR: 2.4,      // mSv/ano, fundo natural médio na Terra. UNSCEAR 2008, Anexo B, média mundial (real)
    TRANSIT_ROUND: 660,      // mSv, só os trânsitos de ida e volta (~0,66 Sv). SwRI/RAD (real)
    FULL_MISSION: 1010,      // mSv, missão completa com ~500 dias em Marte (~1,01 Sv). Hassler et al. 2014, Science: 180 d de ida + 500 d na superfície + 180 d de volta (real, estimativa publicada)
  };

  /* Proteção durante a saída: fator sobre a dose de raios cósmicos (gcr) e de evento solar (spe) */
  const PROT = {
    traje: { name: 'Traje de EVA, a pé', gcr: 1, spe: 1 },
    rover: { name: 'Rover pressurizado', gcr: 1 - RC.GCR_SHIELD, spe: 1 - RC.SPE_SHIELD },
  };
  const HABITAT = { gcr: 1 - RC.GCR_SHIELD, spe: 1 - RC.SPE_SHIELD };  // dentro da base (suposição: blindagem típica)

  const SOLAR = {
    calmo: { name: 'Calma', mult: 1 },
    elevado: { name: 'Elevada', mult: 1 },          // risco de evento, dose ainda de fundo
    evento: { name: 'Evento em curso', mult: RC.SPE_SURFACE_MULT },
  };

  /* Dose de missões anteriores por tripulante (SUPOSIÇÃO sintética, editável na tela) */
  const PRIOR_DEFAULT = { 1: 72, 2: 0, 3: 45, 4: 0, 5: 110, 6: 38 };

  /* plan: { prior, elapsedDays, surfaceDays, returnDays, hours, sorties, prot, solar, returnMin } */
  function project(plan) {
    const p = PROT[plan.prot] || PROT.traje, s = SOLAR[plan.solar] || SOLAR.calmo;
    const transitSoFar = plan.elapsedDays * RC.RATE_CRUISE;
    const surface = plan.surfaceDays * RC.RATE_SURFACE * HABITAT.gcr;
    const ret = plan.returnDays * RC.RATE_CRUISE;
    /* Durante evento solar a taxa sobe (mult); a parte extra é de prótons e a blindagem corta ~50% dela */
    const dose = f => plan.hours / 24 * RC.RATE_SURFACE * (f.gcr + (s.mult - 1) * f.spe);
    const evaPer = dose(p);                                                                   // dose de uma saída
    const evaInHab = dose(HABITAT);                                                           // o que receberia na base no mesmo tempo
    const evaExtra = Math.max(0, evaPer - evaInHab) * plan.sorties;                          // acréscimo real por sair
    const toDate = plan.prior + transitSoFar;
    const total = toDate + surface + ret + evaExtra;
    return { transitSoFar, surface, ret, evaPer, evaExtra, evaTotal: evaPer * plan.sorties, toDate, total, pct: total / RC.LIMIT, margin: RC.LIMIT - total };
  }

  /* Recomendação: seguir / cautela / não seguir, com todos os motivos que dispararam */
  function decide(plan, proj, health) {
    const no = [], ca = [], T = (s, v) => (window.I18N ? window.I18N.t(s, v) : s);
    if (plan.solar === 'evento') no.push(T('evento de partículas solares em curso: permaneça no abrigo'));
    if (plan.solar === 'elevado' && plan.returnMin > RC.EVA_ABORT_MIN) no.push(T('atividade solar elevada e retorno ao abrigo em {m} min, acima das 2 h recomendadas', { m: plan.returnMin }));
    if (proj.total > RC.LIMIT) no.push(T('dose projetada de {d} mSv ultrapassa o limite de carreira de {l} mSv', { d: proj.total.toFixed(0), l: RC.LIMIT }));
    else if (proj.total > RC.CAUTION * RC.LIMIT) ca.push(T('dose projetada de {d} mSv acima de {p}% do limite de carreira', { d: proj.total.toFixed(0), p: Math.round(RC.CAUTION * 100) }));
    if (plan.solar === 'elevado' && plan.returnMin <= RC.EVA_ABORT_MIN) ca.push(T('atividade solar elevada: mantenha o alerta de dosimetria ligado e rota curta até o abrigo'));
    if (health && health.red.length) ca.push(T('status crítico em {s}', { s: health.red.map(x => T(x)).join(T(' e ')) }));
    if (health && health.level === 2 && !health.red.length) ca.push(T('condição geral crítica no último registro'));
    const verdict = no.length ? 'nogo' : ca.length ? 'caution' : 'go';
    return { verdict, reasons: no.concat(ca) };
  }

  /* Taxa de eventos SEP proporcional ao número de manchas solares, ajustada nos dados reais (NOAA + DONKI) */
  function sepModel(sw) {
    if (!sw || !sw.ssn || !sw.sep) return null;
    const count = {}; sw.sep.forEach(e => { const k = e[0].slice(0, 7); count[k] = (count[k] || 0) + 1; });
    const cov = new Set(sw.sep_months_covered || []);   // só meses que o DONKI cobriu por inteiro
    const months = sw.ssn.filter(m => cov.has(m[0]) && m[1] >= 0);
    let sumN = 0, sumS = 0;
    months.forEach(m => { sumN += count[m[0]] || 0; sumS += Math.max(0, m[1]); });
    const k = sumS ? sumN / sumS : 0;  // eventos por mês por unidade de manchas
    const lambda = ssn => k * Math.max(0, ssn);
    const pMonth = ssn => 1 - Math.exp(-lambda(ssn));
    return { k, count, lambda, pMonth, months: months.length, events: sumN, cov };
  }

  window.RAD = { RC, PROT, HABITAT, SOLAR, PRIOR_DEFAULT, project, decide, sepModel };
})();

        <div class="chart-wrap"><div class="chart-box" data-r="chart"></div><div class="legend" data-r="lg" style="margin-top:10px"></div></div>

      drawMetric(b, el, c.crew, m, st);

  function drawMetric(root, el, crew, m, st) {
    const q = r => root.querySelector(`[data-r="${r}"]`);
    const pts = A.series(m, crew.id), b = A.baseline(m, crew.id), a = st.items.find(i => i.m.key === m.key);
    el.querySelector('.mod-t h2').textContent = T('{l} ({u}), histórico da missão', { l: m.label, u: m.unit });
    const sub = b ? (b.source === 'individual' ? T('Faixa destacada: seu padrão (mediana ± 2 desvios) dos primeiros {n} dias.', { n: A.BASE_DAYS }) : T('Sem histórico suficiente: padrão calculado pela {s}.', { s: T(b.source) })) : T('Sem padrão calculado.');
    el.querySelector('.mod-t').insertAdjacentHTML('beforeend', `<p>${esc(sub)}</p>`);
    const phases = []; let cur = null; A.DB.phases.forEach(([d, p]) => { if (!cur || cur.label !== p) { cur = { label: p, from: A.ts(d), to: A.ts(d) + A.DAY }; phases.push(cur); } else cur.to = A.ts(d) + A.DAY; });
    const flag = p => { if (!b || m.noZ) return 0; const sz = A.adverseZ(m, (p.v - b.med) / b.sigma); return sz >= 3 ? 2 : sz >= 2 ? 1 : 0; };
    const ev = A.DB.events.filter(e => e.crew === crew.id).map(e => ({ from: A.ts(e.start), to: A.ts(e.end), label: T('Cenário simulado: ') + e.type }));
    U.lineChart(q('chart'), { series: [{ id: crew.id, name: crew.name, color: U.crewColor(crew.id), pts: m.cat === 'env' ? A.daily(m, 0) : pts }], band: b && !m.noZ ? { lo: b.lo, hi: b.hi, med: b.med } : null, ref: m.ok ? { lo: m.ok[0], hi: m.ok[1] } : null, unit: m.unit, dec: m.dec, phases, events: ev, flag, height: 320, aria: `${m.label}, ${crew.name}`, snap: true,
      sub: t => { const p = pts.find(x => Math.abs(x.t - t) < A.DAY); if (!p || !b || m.noZ) return null; const z = (p.v - b.med) / b.sigma; return T('{z} desvios do seu padrão', { z: `${z > 0 ? '+' : '−'}${fmt(Math.abs(z), 1)}` }); } });
    q('lg').innerHTML = `<span><i style="background:${U.crewColor(crew.id)}"></i>${esc(crew.name)}</span>${b && !m.noZ ? `<span><i class="sw" style="background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)"></i>${T('Seu padrão')}</span>` : ''}${m.ok ? `<span><i class="sw" style="background:var(--good-bg);box-shadow:inset 0 0 0 1px var(--good)"></i>${T('Faixa de referência')}</span>` : ''}<span><i class="sw" style="background:var(--warn)"></i>${T('Cenário simulado (rótulo do gerador)')}</span><span><i class="sw" style="background:var(--warn);border-radius:50%"></i>${T('Ponto com desvio')}</span>`;
    const vals = pts.map(p => p.v), w7 = pts.slice(-7).map(p => p.v);

    const acts = Object.entries(m.act).map(([k, v]) => (Object.keys(m.act).length > 1 ? T(k === 'high' ? 'Se estiver alto: ' : 'Se estiver baixo: ') : '') + esc(v)).join('<br>');

  /* ---------- TRI-11 Alertas ---------- */
  M.define({ id: 'TRI-11', flush: true, key: 'tri.alertas', title: 'Alertas recentes', sub: 'Do último registro de cada indicador.', size: 'l',
    render(b, c) {

    const ctx = { S, crews, crew, st: A.crewStatus(crew.id), m: A.MBY[S.metric], rerender: () => render(root) };

  }

  V.tripulante = { render, LAYOUT };
})();

(function () {
  const A = window.AT, U = window.UI, M = window.MOD, { esc, fmt, icon, chip } = U;

  const get = (c, k) => c.st.items.find(i => i.m.key === k);
  const base = (c, k) => { const b = A.baseline(A.MBY[k], c.crew.id); return b && b.source === 'individual' ? b : null; };
  const last14 = (c, k) => A.daily(A.MBY[k], c.crew.id).slice(-14);

  /* Botão "Histórico": abre a métrica no TRI-10 */
  function histBtn(el, c, key) {
    const x = el.querySelector('.mod-x');
    x.insertAdjacentHTML('beforeend', `<button class="btn ghost sm hist-btn" type="button" aria-label="${T('Ver histórico da missão')}" title="${T('Ver histórico da missão (abre no TRI-10)')}">${icon('chart')}</button>`);

    };

  function statusChip(el, a) { el.querySelector('.mod-x').insertAdjacentHTML('afterbegin', a ? chip(a.level) : `<span class="chip n">${T('Sem dados')}</span>`); }

  /* Valor grande + padrão pessoal */
  function readout(a, m, b, extra) {
    if (!a) return '<div class="vr"><strong class="num">—</strong></div>';
    const rd = x => Math.round(x * Math.pow(10, m.dec)) / Math.pow(10, m.dec);
    const d = b ? rd(rd(a.v) - rd(b.med)) : null;  // diferença entre os valores como exibidos
    const vs = b ? `${T('Seu padrão:')} <b class="num">${fmt(b.med, m.dec)}</b> ${esc(m.unit)}${Math.abs(d) >= Math.pow(10, -m.dec) ? ` (${d > 0 ? '+' : '−'}${fmt(Math.abs(d), m.dec)})` : ''}` : T('Padrão pessoal ainda não calculado');
    return `<div class="vr"><strong class="num">${fmt(a.v, m.dec)}<small>${esc(m.unit)}</small></strong><span>${vs}</span>${extra || ''}<time>${a.p ? T('Medido em {d}', { d: U.fmtDT(a.p.date) }) : ''}</time></div>`;
  }

  /* ---------- TRI-05 Cabeçalho da seção de sinais vitais ---------- */
  M.define({ id: 'TRI-05', key: 'tri.vitais.secao', title: 'Sinais vitais', size: 'full', bare: true,

  M.define({ id: 'TRI-13', key: 'tri.vitais.fc', title: 'Frequência cardíaca', sub: 'Em repouso', size: 'm',
    render(b, c, el) {
      const m = A.MBY.hr, a = get(c, 'hr'), bs = base(c, 'hr');
      statusChip(el, a); histBtn(el, c, 'hr');
      b.innerHTML = `<div class="gauge-wrap">${U.gauge({ m, v: a && a.v, min: 20, max: 120, base: bs && bs.med, ticks: [m.ok[0], m.ok[1]], marks: [{ v: 60, label: T('60 bpm: limite inferior usual da AHA (atletas costumam ficar abaixo)') }], band: { from: m.ok[1], to: 120, label: T('Faixa esperada durante exercício') } })}</div>
        <div class="g-leg"><span><i class="lg-dash"></i>${T('Esperado em exercício')}</span><span><i class="lg-mark"></i>60 bpm (AHA)</span><span><i class="lg-base"></i>${T('Seu padrão')}</span></div>
        ${readout(a, m, bs)}
        <p class="vnote">${T('Repouso: {a} a {b} bpm. Abaixo de 60 é comum em atletas treinados, como astronautas. Durante exercício, valores acima de {b} bpm são esperados e não geram alerta.', { a: m.ok[0], b: m.ok[1] })}</p>`;

      b.innerHTML = `<div class="g2">${one(ms, s, bs, 70, 180, [120, 130], T('Sistólica'))}${one(md, d, bd, 40, 110, [80], T('Diastólica'))}</div>
        <div class="vr"><strong class="num">${s ? fmt(s.v, 0) : '—'}/${d ? fmt(d.v, 0) : '—'}<small>mmHg</small></strong><span>${bs && bd ? `${T('Seu padrão:')} <b class="num">${fmt(bs.med, 0)}/${fmt(bd.med, 0)}</b> mmHg` : T('Padrão pessoal ainda não calculado')}</span><time>${s && s.p ? T('Medido em {d}', { d: U.fmtDT(s.p.date) }) : ''}</time></div>
        <p class="vnote">${T('Traços brancos: cortes da AHA 2017 (normal abaixo de 120/80, hipertensão a partir de 130/80). Cores: faixas do protótipo, verde até {s}/{d}.', { s: ms.ok[1], d: md.ok[1] })}</p>`;

  /* ---------- TRI-15 Saturação de O2 ---------- */
  M.define({ id: 'TRI-15', key: 'tri.vitais.spo2', title: 'Saturação de O₂', sub: 'Oxímetro de dedo', size: 'm',
    render(b, c, el) {
      const m = A.MBY.spo2, a = get(c, 'spo2'), bs = base(c, 'spo2');

      b.innerHTML = `${readout(a, m, bs)}
        <div class="o2">${U.hbar({ m, v: a && a.v, min: 85, max: 100, base: bs && bs.med, ticks: [m.warn[0], m.ok[0]], zones: [{ from: 85, to: m.warn[0], label: T('Baixa') }, { from: m.warn[0], to: m.ok[0], label: T('Atenção') }, { from: m.ok[0], to: 100, label: T('Ideal') }] })}</div>
